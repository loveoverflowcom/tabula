[package]
name        = "tabula-server"
version     = "0.0.0"
description = "Stage 0 gameplay binary: HTTP API, WebSocket gateway, match runtime, lobby."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 4.
#
# ONE binary composed of library crates that already have the right seams
# (ADR-015). The crates are the boundary; the process count is a deployment
# decision. The split we will actually want later is gateway <-> match-worker,
# and doc 06 §7 specifies both it and its trigger.
#
# Services are LEAVES: nothing depends on this crate.
# ADR-0034 reserves account authentication for tabula-auth + Kanidm; this
# service retains session enforcement, resource permissions and match grants.
#
# Build for production with `--profile release-server` so it UNWINDS: the match
# runtime wraps every apply() in catch_unwind, and a panicking game must abort
# THAT MATCH, not the process (doc 01 §5.2).

[features]
default = []
online-match = ["dep:tabula-match-http"]
local-dev = ["online-match", "dep:tabula-storage", "dep:tabula-session-http", "dep:tabula-session", "dep:tabula-registry", "dep:tokio", "dep:axum", "dep:serde", "dep:figment", "dep:url"]

[package.metadata.tabula-msrv]
online-match = "1.94"
local-dev = "1.94"

[dependencies]
tabula-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tabula-match-http = { workspace = true, optional = true, features = ["isolated"] }
tabula-storage = { workspace = true, optional = true, features = ["local-dev-postgres"] }
tabula-session-http = { workspace = true, optional = true, features = ["social"] }
tabula-session = { workspace = true, optional = true }
tabula-registry = { workspace = true, optional = true, features = ["game-chess", "game-tiles"] }
tokio = { workspace = true, optional = true, features = ["net"] }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
figment = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tabula-session = { workspace = true }
tabula-protocol = { workspace = true }
tabula-match = { workspace = true, features = ["isolated"] }
tabula-registry = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }

