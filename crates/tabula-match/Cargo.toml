[package]
name        = "tabula-match"
version     = "0.0.0"
description = "Authoritative match runtime: MatchActor, the command pipeline, ports."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 4. The hardest, most correctness-critical async code in the product.
# It MUST be testable with in-memory fakes, no database, and no HTTP server —
# which is why every dependency below the line is a port, not an implementation.
# FORBIDDEN: sqlx, axum, any game crate, any renderer.
[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
tabula-protocol = { workspace = true }
tabula-registry = { workspace = true }
thiserror       = { workspace = true }
smallvec        = { workspace = true }

# Phase 4 — the actor loop needs these; the PORT TRAITS do not (native AFIT
# means an async trait needs no runtime dependency at all).
# tokio   = { workspace = true }
# tracing = { workspace = true }
# futures = { workspace = true }
# bytes   = { workspace = true }

[lints]
workspace = true
