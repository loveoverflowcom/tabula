[package]
name        = "tabula-match"
version     = "0.0.0"
description = "Authoritative match runtime: MatchActor, the command pipeline, ports."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 4. The hardest, most correctness-critical async code in the product.
# It MUST be testable with in-memory fakes, no database, and no HTTP server —
# which is why every dependency below the line is a port, not an implementation.
# FORBIDDEN: sqlx, axum, any game crate, any renderer.
[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
tabula-protocol = { workspace = true }
tabula-match-journal = { workspace = true }
tabula-registry = { workspace = true, optional = true }
thiserror       = { workspace = true }
smallvec        = { workspace = true }
serde           = { workspace = true }

# Phase 4 — the actor loop needs these; the PORT TRAITS do not (native AFIT
# means an async trait needs no runtime dependency at all).
# tracing = { workspace = true }
# futures = { workspace = true }
# bytes   = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true }

[features]
default = []
isolated = ["dep:tokio", "dep:tabula-registry"]

[dev-dependencies]
tabula-registry = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
