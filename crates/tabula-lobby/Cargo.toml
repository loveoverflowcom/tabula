[package]
name        = "tabula-lobby"
version     = "0.0.0"
description = "Rooms, matchmaking, presence — domain plus ports."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# The explicitly isolated account/social exception opens only friends and
# presence. Rooms, matchmaking and the remaining Phase 5 gate stay closed.
# FORBIDDEN: sqlx, axum, game crates, and tabula-game-api — the lobby reasons
# about GameCapabilities, never about rules (ADR-023).
[features]
default = []
authority = ["dep:tabula-session"]

[dependencies]
tabula-core     = { workspace = true }
serde          = { workspace = true }
thiserror       = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tabula-session = { workspace = true, optional = true }

# tokio   = { workspace = true }
# tracing = { workspace = true }

[lints]
workspace = true
