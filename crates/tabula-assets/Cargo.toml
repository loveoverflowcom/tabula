[package]
name        = "tabula-assets"
version     = "0.0.0"
description = "Validated asset-pack contracts, source ports, pure resolution, and byte integrity verification."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 3. Owns pure asset contracts, source ports, resolution, and byte integrity.
# Target-specific I/O adapters and pack-build integrations remain future work.
[dependencies]
tabula-core = { workspace = true }
tabula-game-api = { workspace = true }
serde       = { workspace = true }
blake3      = { workspace = true }
thiserror   = { workspace = true }
toml        = { workspace = true }

# Phase 3+: loader backends are per-target features, never a default.
# reqwest      = { workspace = true, optional = true }
# web-sys      = { workspace = true, optional = true }

[features]
default = []
# http = ["dep:reqwest"]
# web  = ["dep:web-sys"]

[lints]
workspace = true
