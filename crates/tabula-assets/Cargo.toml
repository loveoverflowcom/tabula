[package]
name        = "tabula-assets"
version     = "0.0.0"
description = "Validated asset-pack manifests and identity types."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 3. Currently owns only the pure manifest and identity contract. Future
# client, server, and pack-build integrations must consume these validated types.
[dependencies]
tabula-core = { workspace = true }
serde       = { workspace = true }
blake3      = { workspace = true }
thiserror   = { workspace = true }
toml        = { workspace = true }

# Phase 3+: loader backends are per-target features, never a default.
# reqwest      = { workspace = true, optional = true }
# web-sys      = { workspace = true, optional = true }

[features]
default = []
# http = ["dep:reqwest"]
# web  = ["dep:web-sys"]

[lints]
workspace = true
