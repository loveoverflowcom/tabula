[package]
name = "tabula-session-http"
version = "0.0.0"
description = "Opt-in isolated account-session HTTP boundary; production remains gated."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
isolated = ["dep:tabula-session", "dep:axum", "dep:tokio", "dep:hmac", "dep:sha2", "dep:base64", "dep:bytes", "dep:http-body", "dep:url"]
postgres = ["isolated", "dep:tabula-storage", "dep:sqlx"]

# The locked url/IDNA/ICU graph is native isolated-only; default DTO declaration stays 1.85.
[package.metadata.tabula-msrv]
isolated = "1.88"
postgres = "1.94"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tabula-session = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util"] }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tabula-storage = { workspace = true, optional = true, features = ["session-postgres"] }
sqlx = { workspace = true, optional = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tabula-core = { workspace = true }
tower = { workspace = true, features = ["util"] }
proptest = { workspace = true }
