[package]
name        = "tabula-testkit"
version     = "0.1.0"
description = "Conformance harness every Tabula game must pass: determinism, projection safety, replay."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
serde           = { workspace = true }
postcard        = { workspace = true }
blake3          = { workspace = true }
thiserror       = { workspace = true }
smallvec        = { workspace = true }
proptest        = { workspace = true }
crc32fast       = { workspace = true }
ruzstd          = { workspace = true }

# Phase-gated. The dependency graph in doc 01 §4 has testkit depending on
# registry/match/presentation, but those crates do not become real until Phases 4
# and 2. Keeping them optional means a Phase-0 checkout builds and tests in
# seconds, and turning the feature on later is a one-line change.
#
# `tabula-registry` and `tabula-match` are NOT listed any more, even optionally:
# the registry now links game crates, every game crate links this crate for its
# conformance suite, and cargo rejects the resulting package cycle regardless of
# which features are selected. They return when the match runtime is real and
# the fakes below are implemented against its ports; today the `runtime` feature
# they backed enabled no code at all (see `src/fakes.rs`).
tabula-presentation = { workspace = true, optional = true }
insta               = { workspace = true, optional = true }

[features]
default = []
# Phase 4: replay against the real registry, fakes for the match runtime ports.
# The feature stays so the gate it marks keeps its name, but it can no longer
# pull those crates in: see the dependency note above.
runtime = []
# Phase 2: RenderList golden comparison.
presentation = ["dep:tabula-presentation", "dep:insta"]

[lints]
workspace = true
