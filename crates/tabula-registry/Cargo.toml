[package]
name        = "tabula-registry"
version     = "0.0.0"
description = "The game catalog: register! macro, ErasedGame/ErasedMatch, version resolution."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 4. The ONLY crate allowed to name a game. That containment is what makes
# I-9 checkable: platform crates depend on this interface, never on games.
[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
tabula-protocol = { workspace = true }
serde           = { workspace = true }
thiserror       = { workspace = true }

# Each game is behind its own feature so a small bundle or a dedicated
# tournament server can link a subset (doc 02 §8.1). `bots` is linked because
# the catalog inventories actual factories independently of gameplay-host
# support; a linked bot does not make an unimplemented AI runtime available.
tabula-game-chess = { workspace = true, optional = true, features = ["rules", "bots"] }
tabula-game-tiles = { workspace = true, optional = true, features = ["rules", "bots"] }
# Not yet linkable: caro has no rules and werewolf has no complete module.
# tabula-game-caro      = { workspace = true, optional = true }
# tabula-game-werewolf  = { workspace = true, optional = true }

[features]
default    = ["game-chess", "game-tiles"]
game-chess = ["dep:tabula-game-chess"]
game-tiles = ["dep:tabula-game-tiles"]

[lints]
workspace = true
