[package]
name        = "tabula-game-client"
default-run = "tabula-game-client"
version     = "0.0.0"
description = "The Macroquad gameplay client: desktop and web-at-/play/:match_id; native mobile embedding remains unavailable (ADR-0043)."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 2 (hot-seat) → PHASE 4 (online) → PHASE 6 (native mobile host, ADR-0043).
#
# I-15: `leptos` must NEVER appear in this crate's dependency graph, native or
# wasm. Gameplay does not live in a DOM runtime (ADR-011, ADR-019).
# `xtask check-deps` enforces it.

[lib]
name       = "tabula_game_client"
# Native mobile ABI/artifact packaging is not implemented or approved (ADR-0043).
# Keep the existing Rust library only; a source skeleton does not create a cdylib/staticlib.
crate-type = ["rlib"]

[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
tabula-design       = { workspace = true }
tabula-presentation = { workspace = true }
tabula-assets       = { workspace = true }
tabula-render-macroquad    = { workspace = true }
macroquad           = { workspace = true }
glam                = { workspace = true }
# Phase 2 uses the game package directly; the Phase 4 registry will replace
# this leaf dependency when the online runtime is introduced.
tabula-game-chess   = { workspace = true, features = ["rules", "presentation"], optional = true }
tabula-game-tiles     = { workspace = true, features = ["rules", "presentation", "bots"], optional = true }
# Opt-in DTO surface; no native authority.
tabula-protocol = { workspace = true, optional = true }
tabula-net-client = { workspace = true, optional = true }
tabula-match-http = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# Phase 4+
# tabula-protocol   = { workspace = true }
# tabula-registry   = { workspace = true }
# tabula-net-client = { workspace = true }

tabula-game-werewolf = { workspace = true, features = ["rules", "presentation"], optional = true }

[[bin]]
name = "tabula-game-client"
path = "src/main.rs"
required-features = ["chess"]

[[bin]]
name = "tabula-werewolf-client"
path = "src/bin/werewolf.rs"
required-features = ["werewolf"]

[features]
default = ["chess", "tiles"]
chess = ["dep:tabula-game-chess"]
# The deployed local Chess host opts out of the native multi-game leaf wiring.
tiles  = ["dep:tabula-game-tiles"]
# ADR-0035 opt-in isolated-seat local simulator, not online social launch.
werewolf = ["dep:tabula-game-werewolf"]
# tokio only behind the native feature, for the native transport (doc 00 §8.1).
native = []
web    = ["chess"]
web-werewolf = ["werewolf"]
# Separate authenticated document; default local hot seat is unchanged.
online = ["dep:tabula-protocol", "dep:tabula-net-client", "dep:tabula-match-http", "dep:serde_json", "dep:serde"]

# Preserve the existing cross-game unit/integration/renderer-example evidence
# under native test builds, including --no-default-features. This development
# dependency is not part of the deployed WASM binary's normal dependency graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tabula-game-chess = { workspace = true, features = ["rules", "presentation"] }
tabula-game-tiles = { workspace = true, features = ["rules", "presentation", "bots"] }
# D05 presentation-pilot example only: the compiled D01 catalog is its timing oracle.
tabula-game-age-war = { workspace = true, features = ["rules"] }

[lints]
workspace = true
