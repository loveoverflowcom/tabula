<!DOCTYPE html>
<!-- Trunk entry point for the Leptos shell. PHASE 5. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tabula</title>
    <!-- Source-derived identity exports; no game assets are loaded for branding. -->
    <link data-trunk rel="copy-dir" href="../../assets/brand/web" data-target-path="brand" />
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
    <link rel="alternate icon" href="brand/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/app-icon-180.png" />
    <link rel="manifest" href="brand/manifest.webmanifest" />

    <!-- Generated by `cargo xtask gen-tokens`. Committed; CI fails if stale. -->
    <link data-trunk rel="css" href="style/tokens.css" />
    <link data-trunk rel="scss" href="style/app.scss" />

    <!-- Rust size builds use standard bulk-memory copy/fill instructions. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory-opt" />

    <!--
      Fonts use font-display: swap with a system fallback (doc 04 §7.4).
      Vietnamese diacritics are REQUIRED in the subset; CJK falls back to a
      system face rather than shipping a 10 MB font.
    -->
  </head>
  <body></body>
</html>
