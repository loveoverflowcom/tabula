# Local development dependencies. (doc 06 §3.1)
#
#   just dev-deps        start
#   just dev-deps-down   stop
#
# This file is for DEPENDENCIES ONLY. The server and clients run from `cargo run`
# so that a code change is a rebuild, not a container rebuild.
#
# No Kubernetes, no Helm, no service mesh (ADR-020). At Stage 0–1 production is
# systemd on one host; containers only become the deployment mechanism at Stage 2
# (doc 06 §12).

name: tabula-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tabula
      POSTGRES_PASSWORD: tabula
      POSTGRES_DB: tabula_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabula"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      # Mirror the production values that actually affect behaviour, so a
      # "works on my machine" is meaningful. (doc 06 §3.3)
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "synchronous_commit=on"

  # Span-per-command tracing is the debugging tool for a match runtime
  # (doc 01 §1.2). Have it from day one, not after the first mystery.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI — this is where you look when a command feels slow

  # Object-storage stand-in for replays, large snapshots, and asset packs.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tabula
      MINIO_ROOT_PASSWORD: tabuladev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # PHASE 8 — voice. Uncomment when tabula-voice lands.
  # coturn:
  #   image: coturn/coturn:latest
  #   network_mode: host
  #   command: ["-n", "--log-file=stdout", "--realm=tabula.local"]
  #
  # livekit:
  #   image: livekit/livekit-server:latest
  #   command: ["--dev"]
  #   ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  pgdata:
  miniodata:
