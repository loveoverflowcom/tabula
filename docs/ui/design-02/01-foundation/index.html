<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabula Foundation / Theme / Settings</title><link rel="stylesheet" href="prototype.css"><header><h1>Tabula · Foundation / Theme / Settings</h1><label>Màn hình <select id="screens"></select></label><label>Xem <select id="zoom"><option value="fit">Vừa chiều rộng</option><option value="full">Kích thước 1440px</option></select></label><a id="source">SVG chỉnh sửa được</a><p>Bản thiết kế tĩnh · dữ liệu mẫu · không chạy luật, backend hay AI</p></header><main><p id="label"></p><img id="design" alt="Thiết kế Tabula; mô tả và state contract nằm trong implementation-notes.md"></main><script id="screen-data" type="application/json">[{"id": "13-settings", "title": "Cài đặt", "file": "screens/13-settings.svg"}, {"id": "22-design-system", "title": "Bộ thành phần", "file": "screens/22-design-system.svg"}, {"id": "mobile-states", "title": "Mobile & trạng thái", "file": "screens/mobile-states.svg"}, {"id": "23-theme-parity", "title": "Four canonical schemes", "file": "screens/23-theme-parity.svg"}]</script><script>const screens=JSON.parse(document.getElementById('screen-data').textContent);const select=document.getElementById('screens'),figure=document.getElementById('design');for(const s of screens){const option=document.createElement('option');option.value=s.file;option.textContent=s.id+' · '+s.title;select.append(option)}function show(){figure.src=select.value;document.querySelector('a#source').href=select.value;document.querySelector('#label').textContent=screens.find(s=>s.file===select.value).title}select.addEventListener('change',show);document.querySelector('#zoom').addEventListener('change',e=>{figure.style.width=e.target.value==='fit'?'100%':'1440px'});show();</script></html>
