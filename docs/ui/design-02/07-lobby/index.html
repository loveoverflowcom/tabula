<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabula Rooms / Ready room / Queue</title><link rel="stylesheet" href="prototype.css"><header><h1>Tabula · Rooms / Ready room / Queue</h1><label>Màn hình <select id="screens"></select></label><label>Xem <select id="zoom"><option value="fit">Vừa chiều rộng</option><option value="full">Kích thước 1440px</option></select></label><a id="source">SVG chỉnh sửa được</a><p>Bản thiết kế tĩnh · dữ liệu mẫu · không chạy luật, backend hay AI</p></header><main><p id="label"></p><img id="design" alt="Thiết kế Tabula; mô tả và state contract nằm trong implementation-notes.md"></main><script id="screen-data" type="application/json">[{"id": "17-rooms", "title": "Phòng chơi", "file": "screens/17-rooms.svg"}, {"id": "18-room", "title": "Phòng chờ", "file": "screens/18-room.svg"}, {"id": "19-queue", "title": "Ghép trận", "file": "screens/19-queue.svg"}, {"id": "mobile-states", "title": "Mobile & trạng thái", "file": "screens/mobile-states.svg"}]</script><script>const screens=JSON.parse(document.getElementById('screen-data').textContent);const select=document.getElementById('screens'),figure=document.getElementById('design');for(const s of screens){const option=document.createElement('option');option.value=s.file;option.textContent=s.id+' · '+s.title;select.append(option)}function show(){figure.src=select.value;document.querySelector('a#source').href=select.value;document.querySelector('#label').textContent=screens.find(s=>s.file===select.value).title}select.addEventListener('change',show);document.querySelector('#zoom').addEventListener('change',e=>{figure.style.width=e.target.value==='fit'?'100%':'1440px'});show();</script></html>
