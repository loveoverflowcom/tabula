f" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Đếm ngược dựa trên deadline server.</text><rect x="1040" y="326" width="348" height="48" rx="24" fill="#E1DDE4"/><text x="1214.0" y="356" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" fill="#696370" text-anchor="middle">Vào phòng · có gate</text><rect x="1020" y="416" width="388" height="214" rx="28" fill="#F4EDF7"/><text x="1040" y="450" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="600" fill="#1E1C21" text-anchor="start">Timeout / hết hiệu lực</text><text x="1040" y="476" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Nêu lý do ticket kết thúc.</text><text x="1040" y="500" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Không tự đăng ký lại vô hạn.</text><text x="1040" y="524" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Giữ mode/time để thử lại.</text><rect x="1040" y="562" width="348" height="48" rx="24" fill="#EAE3ED"/><text x="1214.0" y="592" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" fill="#4B4650" text-anchor="middle">Thử lại</text><rect x="1020" y="652" width="388" height="232" rx="28" fill="#F4EDF7"/><text x="1040" y="686" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="600" fill="#1E1C21" text-anchor="start">Mất kết nối</text><text x="1040" y="712" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Reconcile ticket trước retry.</text><text x="1040" y="736" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Không tạo hai ticket song song.</text><text x="1040" y="760" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400" fill="#4B4650" text-anchor="start">Trở về lobby giữ state cần thiết.</text><rect x="1040" y="816" width="348" height="48" rx="24" fill="#EAE3ED"/><text x="1214.0" y="846" font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" fill="#4B4650" text-anchor="middle">Về phòng chơi</text></svg>