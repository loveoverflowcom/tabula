<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabula · Đối chiếu avatar tài khoản mẫu</title><link rel="stylesheet" href="style.css"></head><body class="avatar-comparison"><main><div class="comparison-heading"><span class="eyebrow">HỢP ĐỒNG HIỂN THỊ MỤC TIÊU · MẪU</span><h1>Một tài khoản. Một avatar.</h1><p>Cùng subject và asset trên hồ sơ tham chiếu và ghế Ma Sói.</p><p class="comparison-note">Đây là fixture thiết kế; dashboard/API hiện tại chưa có luồng avatar này.</p><a href="index.html">Trở lại bàn Ma Sói</a></div><div class="comparison-columns"><h2>Hồ sơ / dashboard tham chiếu</h2><h2>Ghế trong bàn Ma Sói</h2></div><div id="avatar-comparison-pairs"></div></main><script type="module">
import {fixture,profiles,mountAvatar} from './account-avatars.mjs';
const root=document.querySelector('#avatar-comparison-pairs');
for(const subjectId of fixture.comparisonSubjectIds){const p=profiles.find(x=>x.subjectId===subjectId);const row=document.createElement('div');row.className='comparison-pair';row.innerHTML=`<section class="comparison-profile"><span class="comparison-avatar"></span><div><strong>${p.displayName}</strong><span>${p.subjectId}</span><small>Avatar tài khoản · mẫu</small></div></section><section class="comparison-seat"><span class="portrait-frame"></span><div><strong>${p.displayName}</strong><span>GHẾ ${String(profiles.indexOf(p)+1).padStart(2,'0')}</span><small>Cùng asset và fallback</small></div></section>`;mountAvatar(row.querySelector('.comparison-avatar'),p);mountAvatar(row.querySelector('.portrait-frame'),p);root.append(row);}
window.avatarComparison={sample:true,profiles:fixture.comparisonSubjectIds.map(id=>profiles.find(p=>p.subjectId===id)),sharedResolver:true};
</script></body></html>
