const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function avatar(initials='MD',tone='lavender',size=''){return `<span class="avatar ${tone} ${size}">${initials}</span>`;}

function pageHead(eyebrow,title,subtitle='',actions=''){return `<header class="page-heading"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1>${subtitle?`<p class="page-description">${subtitle}</p>`:''}</div>${actions?`<div class="heading-actions">${actions}</div>`:''}</header>`;}
function emptyState(title,desc,action=''){return `<div class="empty-state">${icon('search')}<h3>${title}</h3><p>${desc}</p>${action}</div>`;}
function gameCard(g,state){return `<article class="game-card" data-category="${g.category}" data-name="${g.name.toLowerCase()} ${g.label.toLowerCase()}"><a href="#game/${g.id}" class="game-cover ${g.tone}" aria-label="Mở ${g.name}">${gameArt(g.id)}<span class="cover-label">${g.tag}</span></a><div class="game-card-body"><div class="row-between"><a class="game-name" href="#game/${g.id}">${g.name}</a><button class="icon-button favorite ${state.favorites.includes(g.id)?'is-favorite':''}" data-action="favorite" data-value="${g.id}" aria-label="${state.favorites.includes(g.id)?'Bỏ':'Thêm'} ${g.name} ${state.favorites.includes(g.id)?'khỏi':'vào'} yêu thích" aria-pressed="${state.favorites.includes(g.id)}">${icon('heart')}</button></div><div class="game-meta"><span>${icon('users')}${g.players} người</span><span>${icon('clock')}${g.time}</span></div></div></article>`;}
function libraryScreen(state){
 return `${pageHead('KHÔNG GIAN CHƠI CỦA BẠN','Chơi một ván nhé?','Một khoảng nghỉ nhỏ. Một nước đi mới.',button('Ván của tôi',{href:'history',variant:'tonal',ico:'history'}))}
 <section class="feature-hero"><div class="hero-copy"><span class="eyebrow hero-eyebrow">${icon('spark')} GÓC KHÁM PHÁ MỚI</span><h2>Mỗi nước đi,<br>một điều để học.</h2><p>Cờ tướng cùng gia sư AI.<br>Không chỉ biết đi đâu, mà hiểu vì sao.</p><div class="hero-actions">${button('Khám phá Xiangqi Tutor',{href:'game/xiangqi',ico:'arrow'})}<span class="micro-copy">Chơi · Phân tích · Học</span></div></div><a class="hero-art" href="#game/xiangqi" aria-label="Khám phá Cờ tướng">${gameArt('xiangqi','hero-illustration')}<span class="floating-note">${icon('spark')} Một nước đi. Nhiều góc nhìn.</span></a></section>
 <section class="continue-strip"><span class="continue-icon">${chessPiece('N')}</span><div><span class="eyebrow">BÀN CỜ VẪN ĐỢI BẠN</span><h3>Cờ vua cùng Minh Anh <span class="inline-dot">·</span> <span class="normal muted">Đến lượt bạn</span></h3></div><span class="continue-time">${icon('clock')} 05:42</span>${button('Tiếp tục',{href:'play/chess',variant:'secondary',ico:'arrow'})}</section>
 <section class="catalog-section"><div class="section-heading"><h2>Tìm niềm vui tiếp theo</h2><label class="search-field">${icon('search')}<input id="game-search" type="search" placeholder="Tìm trò chơi…" aria-label="Tìm trò chơi" value="${escapeHtml(state.gameSearch||'')}"><kbd>/</kbd></label></div><div class="filter-row" aria-label="Lọc game">${[['all','Tất cả'],['strategy','Chiến thuật'],['quick','Chơi nhanh'],['party','Hội nhóm'],['favorite','Yêu thích']].map(([id,name])=>`<button class="chip ${state.gameFilter===id?'active':''}" data-action="game-filter" data-value="${id}" aria-pressed="${state.gameFilter===id}">${id==='favorite'?icon('heart'):''}${name}</button>`).join('')}<span class="filter-count">5 trò chơi · bản thiết kế</span></div><div class="game-grid" id="game-grid">${GAMES.map(g=>gameCard(g,state)).join('')}</div><div id="game-empty" hidden>${emptyState('Chưa tìm thấy trò chơi','Thử một từ khóa hoặc bộ lọc khác.')}</div></section>
 <div class="gentle-note">${icon('leaf')} Chơi local không cần tài khoản. Mọi số liệu trong prototype đều là minh họa.</div>`;
}
function detailScreen(id,state){const g=GAME_BY_ID[id]||GAMES[0];const tutor=g.id==='xiangqi';
 return `${breadcrumb('Thư viện game')}<div class="detail-hero"><div class="detail-art ${g.tone}">${gameArt(g.id,'detail-illustration')}<span class="edition-tag">TABULA ORIGINALS <span>01 / ${g.label.toUpperCase()}</span></span></div><div class="detail-copy"><div class="row gap-8">${badge(tutor?'GAME + GIA SƯ':'BOARD GAME','purple',g.icon)}${badge('Bản thiết kế','neutral')}</div><h1>${g.name}${tutor?'<span>cùng một người thầy.</span>':''}</h1><p>${g.desc}</p><div class="detail-facts"><div>${icon('users')}<strong>${g.players}</strong><span>người chơi</span></div><div>${icon('clock')}<strong>${g.time.replace(' phút','')}</strong><span>phút mỗi ván</span></div><div>${icon('target')}<strong>${g.level}</strong><span>trải nghiệm</span></div></div><div class="detail-cta">${button('Bắt đầu một ván',{href:`setup/${g.id}`,ico:'play'})}${button(state.favorites.includes(g.id)?'Đã yêu thích':'Yêu thích',{action:'favorite',value:g.id,variant:'secondary',ico:'heart'})}</div><div class="micro-note">${icon('info')}${tutor?'Các tính năng engine / gia sư bên dưới là thiết kế đề xuất.':'Bản minh họa giao diện, không phải game hoàn chỉnh.'}</div></div></div>
 <section class="section-spaced"><div class="section-heading"><h2>${tutor?'Bạn muốn bắt đầu thế nào?':'Một trò chơi, nhiều cách kết nối'}</h2><span class="muted">Chọn nhịp chơi của bạn</span></div><div class="mode-cards"><a class="mode-card" href="#setup/${g.id}"><span class="feature-icon lavender">${icon('play')}</span><h3>Chơi một ván</h3><p>${tutor?'Thử sức cùng AI hoặc rủ bạn bè ngồi vào bàn.':'Cùng bạn bè hoặc theo chế độ game hỗ trợ.'}</p><span class="text-link">Bắt đầu ${icon('arrow')}</span></a><a class="mode-card" href="#analysis/${g.id}"><span class="feature-icon sage">${icon('chart')}</span><h3>Xem lại & phân tích</h3><p>Chậm lại một nhịp. Nhìn ván đấu từ một góc khác.</p><span class="text-link">Mở bàn phân tích ${icon('arrow')}</span></a>${tutor?`<a class="mode-card featured-mode" href="#learn/xiangqi"><span class="feature-icon peach">${icon('spark')}</span><h3>Học cùng gia sư</h3><p>Hỏi về một nước đi. Tự tìm lời giải qua từng gợi ý.</p><span class="text-link">Cùng tìm hiểu ${icon('arrow')}</span></a>`:`<a class="mode-card" href="#rooms"><span class="feature-icon peach">${icon('users')}</span><h3>Chơi cùng mọi người</h3><p>Tìm một bàn chơi phù hợp và gặp những người bạn mới.</p><span class="text-link">Xem phòng chơi ${icon('arrow')}</span></a>`}</div></section>
 <section class="detail-bottom"><div class="surface-panel"><div class="section-heading"><h2>Trước nước đi đầu tiên</h2>${icon('book')}</div><p class="muted">Luật chơi ngắn gọn để bạn tự tin bắt đầu. Nội dung đầy đủ sẽ do từng game cung cấp.</p><div class="rule-steps"><span><b>01</b> Chọn chế độ & thời gian</span><span><b>02</b> Làm quen với bàn chơi</span><span><b>03</b> Đến lượt bạn rồi</span></div>${button('Xem luật chơi',{action:'rules',value:g.id,variant:'text',ico:'arrow'})}</div><a class="resource-mini" href="#resources/${g.id}"><span class="feature-icon">${icon('download')}</span><div><h3>Tài nguyên của game</h3><p>Bàn cờ, engine và khả năng chơi offline.</p><span class="text-link">Xem tài nguyên ${icon('arrow')}</span></div></a></section>`;
}
function setupScreen(id,state){const g=GAME_BY_ID[id]||GAMES[0],s=state.setup;
 return `${breadcrumb(g.name,`game/${g.id}`)}${pageHead('CHUẨN BỊ BÀN CHƠI','Một ván theo cách của bạn.','Chọn đối thủ, nhịp chơi và bắt đầu.')}
 <div class="setup-layout"><form id="setup-form" class="setup-form surface-panel"><section class="form-section"><div class="numbered-title"><span>01</span><div><h2>Bạn sẽ chơi cùng ai?</h2><p>Cấu hình theo khả năng mà game cung cấp.</p></div></div><div class="choice-grid three">${[['local','users','Cùng một máy','Chuyền lượt cho nhau'],['bot','cpu','Huấn luyện viên','Luyện tập với máy'],['online','globe','Bạn bè online','Tạo một phòng riêng']].map(([v,i,n,d])=>{const avail=g.modes.includes(v);return `<label class="choice-card ${s.mode===v?'chosen':''} ${!avail?'unavailable':''}"><input type="radio" name="mode" value="${v}" ${s.mode===v?'checked':''} ${!avail?'disabled':''}>${icon(i)}<strong>${n}</strong><span>${avail?d:'Chưa hỗ trợ trong mẫu'}</span><i class="radio-indicator"></i></label>`}).join('')}</div></section>
 <section class="form-section"><div class="numbered-title"><span>02</span><div><h2>Chọn nhịp chơi</h2><p>Cứ thong thả, hoặc thêm một chút thử thách.</p></div></div><div class="time-options">${[['unlimited','Không giới hạn','Chơi thật thong thả'],['10','10 phút','Một khoảng nghỉ'],['15','15 + 10','Thêm 10 giây mỗi lượt'],['30','30 phút','Dành thời gian suy nghĩ']].map(([v,n,d])=>`<label class="time-choice ${s.time===v?'chosen':''}"><input type="radio" name="time" value="${v}" ${s.time===v?'checked':''}><strong>${n}</strong><span>${d}</span></label>`).join('')}</div></section>
 <section class="form-section"><div class="numbered-title"><span>03</span><div><h2>${s.mode==='bot'?'Mức độ thử thách':'Chỗ ngồi của bạn'}</h2><p>${s.mode==='bot'?'Độ khó là cấu hình minh họa, chưa kết nối engine.':'Chọn bên bạn muốn bắt đầu.'}</p></div></div>${s.mode==='bot'?`<div class="level-choices">${[['easy','Làm quen','Tập trung vào luật và nước đi cơ bản.'],['balanced','Vừa sức','Có thử thách, có khoảng để thử nghiệm.'],['hard','Thử thách','Dành cho những lúc muốn tiến xa hơn.']].map(([v,n,d])=>`<label class="level-choice ${s.level===v?'chosen':''}"><input type="radio" name="level" value="${v}" ${s.level===v?'checked':''}><span class="radio-indicator"></span><span><strong>${n}</strong><small>${d}</small></span></label>`).join('')}</div>`:''}<div class="side-picker"><span>Bên chơi</span><div class="segmented">${[['red',g.id==='chess'?'Trắng':'Đỏ'],['random','Ngẫu nhiên'],['black','Đen']].map(([v,n])=>`<label class="${s.side===v?'active':''}"><input type="radio" name="side" value="${v}" ${s.side===v?'checked':''}>${n}</label>`).join('')}</div></div></section></form>
 <aside class="setup-summary"><div class="summary-art ${g.tone}">${gameArt(g.id)}</div><div class="summary-body"><span class="eyebrow">BÀN CHƠI CỦA BẠN</span><h2>${g.name}</h2><dl class="summary-list"><div><dt>Đối thủ</dt><dd>${s.mode==='bot'?'Huấn luyện viên':s.mode==='online'?'Bạn bè online':'Cùng một máy'}</dd></div><div><dt>Thời gian</dt><dd>${s.time==='unlimited'?'Không giới hạn':s.time==='15'?'15 phút + 10 giây':s.time+' phút'}</dd></div><div><dt>Chế độ</dt><dd>${s.mode==='online'?'Phòng riêng':'Luyện tập · không xếp hạng'}</dd></div></dl><div class="soft-notice">${icon('leaf')}<p>Không áp lực thắng thua.<br>Mỗi ván là một lần khám phá.</p></div>${button(s.mode==='online'?'Tạo phòng chơi':'Vào bàn chơi',{action:'start-match',value:g.id,ico:'arrow',cls:'full-width'})}<p class="center micro-copy">Thiết lập được ghi nhớ trên trình duyệt này.</p></div></aside></div>`;
}
function playerBar(name,sub,time,tone='lavender',active=false,initials='AI'){return `<div class="player-bar ${active?'player-active':''}"><div class="row gap-12">${avatar(initials,tone)}<div><strong>${name}</strong><span>${sub}</span></div></div><div class="player-clock ${active?'clock-active':''}">${active?'<i></i>':''}${time}</div></div>`;}
function modeTabs(id,active){return `<nav class="game-mode-tabs" aria-label="Chế độ game">${[['play','play','Chơi'],['analysis','chart','Phân tích'],['learn','spark','Gia sư']].map(([mode,ico,label])=>`<a href="#${mode}/${id}" class="${active===mode?'active':''}" ${active===mode?'aria-current="page"':''}>${icon(ico)}${label}</a>`).join('')}</nav>`;}
function moveList(id,state){const isChess=id==='chess';const rows=isChess?[['e4','e5'],['Mf3','Mc6'],['Tc4','Mf6'],['d3','Tc5'],['0–0','d6'],['Mc3','0–0']]:[['P2–5','M8.7'],['M2.3','X9–8'],['X1–2','B7.1'],['B7.1','P8.4'],['M8.7','M2.3'],['X9–8','X1–2']];return `<div class="move-table"><div class="move-table-head"><span>Lượt</span><span>${isChess?'Trắng':'Đỏ'}</span><span>Đen</span></div>${rows.map(([a,b],i)=>`<div class="move-row ${i===state.replayStep?'current-move':''}"><span>${i+1}.</span><button data-action="select-move" data-value="${i}" aria-label="Xem lượt ${i+1}, ${a}">${a}</button><button data-action="select-move" data-value="${i}" aria-label="Xem lượt ${i+1}, ${b}">${b}</button></div>`).join('')}${state.demoMoves.map((m,i)=>`<div class="move-row current-move"><span>${rows.length+i+1}.</span><span>${escapeHtml(m)}</span><span>—</span></div>`).join('')}</div>`;}
function replayControls(){return `<div class="replay-controls"><button class="icon-button" data-action="replay-first" aria-label="Về nước đầu">${icon('first')}</button><button class="icon-button" data-action="replay-prev" aria-label="Lùi một nước">${icon('back')}</button><button class="icon-button" data-action="replay-next" aria-label="Tiến một nước">${icon('arrow')}</button><button class="icon-button" data-action="replay-last" aria-label="Đến nước cuối">${icon('last')}</button></div>`;}
function boardTools(id){return `<div class="board-tools"><div class="row gap-4"><button class="icon-button" data-action="flip-board" aria-label="Lật bàn cờ">${icon('refresh')}</button><button class="icon-button" data-action="board-settings" aria-label="Tùy chọn bàn chơi">${icon('settings')}</button><button class="icon-button" data-action="fullscreen" aria-label="Phóng to bàn chơi">${icon('expand')}</button></div><span class="micro-copy">Tương tác mô phỏng · chưa nối luật game</span></div>`;}
function defaultMatchPanel(id,state){return `<aside class="match-side"><section class="surface-panel move-panel"><div class="section-heading"><h2>Nước đi</h2>${badge('Ván mẫu','neutral')}</div>${moveList(id,state)}${replayControls()}</section><section class="turn-card"><span class="status-dot"></span><div><strong>Đến lượt bạn</strong><p>Chọn một quân để xem tương tác minh họa.</p></div></section><section class="quiet-panel"><span class="eyebrow">DÀNH MỘT NHỊP ĐỂ SUY NGHĨ</span><p>Không cần vội.<br>Nhìn cả bàn cờ trước khi chọn một nước đi.</p></section><div class="match-side-actions">${button('Chơi lại',{action:'reset-board',value:id,variant:'secondary',ico:'refresh'})}${button('Kết thúc ván mẫu',{href:`result/${id}`,variant:'text',ico:'flag'})}</div></aside>`;}
function playScreen(id,state){const g=GAME_BY_ID[id]||GAMES[1];
 if(id==='werewolf')return werewolfScreen(state);
 if(id==='tiles')return tilesScreen(state);
 const board=id==='chess'?chessBoard(state):id==='caro'?caroBoard(state):xiangqiBoard(state);
 return `${breadcrumb('Thư viện game')}${pageHead('BÀN CHƠI · LUYỆN TẬP',g.name,id==='caro'?'Năm quân liên tiếp. Thêm một ván vui.':'Một khoảng thời gian dành cho những nước đi.',badge('Local · bản mẫu','green','shield'))}${id==='xiangqi'?modeTabs(id,'play'):''}
 <div class="match-layout"><section class="board-column">${playerBar(id==='chess'?'Minh Anh':id==='caro'?'Hoàng Nam':'Huấn luyện viên',id==='xiangqi'?'Đối thủ minh họa · không chạy engine':'Cùng một máy · lượt đối phương','08:16','sage',false,id==='chess'?'MA':id==='caro'?'HN':'AI')}<div class="board-stage ${state.boardFlipped?'flipped':''}" id="board-stage">${board}</div>${playerBar('Bạn',id==='chess'?'Quân trắng':id==='caro'?'Quân X':'Quân đỏ','09:42','lavender',true,'MD')}${boardTools(id)}</section>${id==='caro'?`<aside class="match-side"><div class="surface-panel"><span class="eyebrow">VÁN CHƠI CÙNG BẠN</span><h2>Nối liền 5 quân.</h2><p class="muted">Nhấp một ô trống để đặt quân X/O minh họa. Bản mẫu không tự kiểm tra thắng thua.</p><div class="caro-symbols"><span class="symbol-x">×</span><span class="versus">vs</span><span class="symbol-o">○</span></div><div class="soft-notice">${icon('info')}<p>Luật thắng chính xác sẽ do module Caro quyết định.</p></div></div><div class="turn-card"><span class="status-dot"></span><div><strong>Đến lượt ${(state.caro?.length||9)%2?'O':'X'}</strong><p>${state.caro?.length||9} quân đã được đặt</p></div></div><div class="match-side-actions">${button('Chơi lại',{action:'reset-board',value:id,variant:'secondary',ico:'refresh'})}${button('Kết thúc ván mẫu',{href:`result/${id}`,variant:'text',ico:'flag'})}</div></aside>`:defaultMatchPanel(id,state)}</div>`;
}
function analysisScreen(id,state){if(!['chess','xiangqi'].includes(id))return genericReplayScreen(id,state);const g=GAME_BY_ID[id]||GAMES[0];const isXq=id==='xiangqi';
 return `${breadcrumb('Ván của tôi','history')}${pageHead('KHÔNG GIAN KHÁM PHÁ','Nhìn lại, để đi xa hơn.','Ván luyện tập · Bản replay minh họa',button('Lưu nhánh phân tích',{action:'save-analysis',variant:'tonal',ico:'pin'}))}${isXq?modeTabs(id,'analysis'):''}

 thế cờ mẫu">${icon('upload')}</button></div>${moveList(id,state)}</section>${isXq?`<a class="tutor-callout" href="#learn/xiangqi"><span class="feature-icon lavender">${icon('spark')}</span><span><strong>Muốn hiểu sâu hơn?</strong><small>Cùng gia sư nhìn lại nước đi.</small></span>${icon('arrow')}</a>`:''}</aside></div>`;
}
function learnScreen(id,state){
 return `${breadcrumb('Xiangqi Tutor','game/xiangqi')}${pageHead('GIA SƯ CỜ TƯỚNG','Hiểu một nước. Tiến một bước.','Cùng nhìn vào bàn cờ, không chỉ vào câu trả lời.',button('Bài học của bạn',{action:'lessons',variant:'tonal',ico:'book'}))}${modeTabs('xiangqi','learn')}
 <div class="learn-layout"><section class="board-column"><div class="analysis-context"><span>${icon('branch')} Bàn học · tách khỏi ván gốc</span>${badge('Khai cuộc','purple')}</div><div class="board-stage" id="board-stage">${xiangqiBoard(state,{arrow:state.analysisArrow})}</div><div class="learn-board-note"><span class="number-dot">1</span><div><strong>Mục tiêu nhỏ hôm nay</strong><p>Quan sát quân nào chưa tham gia vào thế trận.</p></div></div>${boardTools('xiangqi')}</section><section class="tutor-panel"><div class="tutor-header"><span class="tutor-avatar">${icon('spark')}</span><div><h2>Người bạn bên bàn cờ</h2><span>Gia sư · Hội thoại mẫu</span></div><button class="icon-button" data-action="reset-chat" aria-label="Bắt đầu hội thoại mẫu mới">${icon('edit')}</button></div><div class="ai-disclaimer">${icon('info')} Phản hồi dựng sẵn để duyệt giao diện. Chưa có AI thật.</div><div class="chat-messages" id="chat-messages"><div class="chat-bubble tutor-bubble"><p>Chào bạn. Mình cùng quan sát thế cờ này nhé.</p><p>Trước khi chọn nước đi, bạn thử tìm một quân ở hàng cuối còn chưa có cơ hội tham gia.</p><div class="chat-card"><span class="eyebrow">HỌC QUA CÂU HỎI</span><strong>Bạn muốn khám phá điều gì?</strong><span>Không cần trả lời đúng ngay lần đầu.</span></div></div><div class="chat-bubble user-bubble">Vì sao nên phát triển quân Mã trước?</div><div class="chat-bubble tutor-bubble"><p>Hãy bắt đầu từ hai câu hỏi nhỏ: quân Mã có thêm đường đi nào, và ô nào ở trung tâm được nó hỗ trợ?</p><p>Bấm phương án bên dưới để xem cách một lời giải gắn với bàn cờ.</p><button class="inline-variation" data-action="show-line">${icon('branch')} Xem đường đi minh họa ${icon('arrow')}</button><span class="evidence-label">${icon('info')} Ví dụ trình bày · không phải phân tích engine</span></div>${state.chat.map(m=>`<div class="chat-bubble ${m.role==='user'?'user-bubble':'tutor-bubble'}"><p>${escapeHtml(m.text)}</p></div>`).join('')}</div><div class="tutor-composer"><div class="suggestion-row"><button data-action="chat-prompt" data-value="Cho tôi một gợi ý nhỏ">Một gợi ý nhỏ</button><button data-action="chat-prompt" data-value="Giải thích dễ hiểu hơn">Dễ hiểu hơn</button></div><form id="chat-form"><label class="sr-only" for="chat-input">Câu hỏi cho gia sư mẫu</label><textarea id="chat-input" name="message" rows="2" placeholder="Hỏi về nước đi bạn đang nghĩ tới…" maxlength="500"></textarea><button class="send-button" type="submit" aria-label="Gửi câu hỏi mẫu">${icon('arrow')}</button></form><p class="micro-copy center">Bàn cờ là trung tâm. Lời giải luôn cần có căn cứ.</p></div></section></div>`;
}
function tilesScreen(state){return `${breadcrumb('Thư viện game')}${pageHead('BÀN CHƠI · 3 NGƯỜI','Miền đất nhỏ','Từng mảnh ghép làm nên một thế giới.',badge('Local · bản mẫu','green','leaf'))}<div class="tiles-players">${[['Bạn','MD','lavender',42],['Bot Rừng','BR','sage',35],['Bot Nắng','BN','peach',28]].map(([n,i,t,s],j)=>`<div class="tile-player ${j===0?'active':''}">${avatar(i,t)}<div><strong>${n}</strong><span>${j===0?'Đến lượt bạn':'Đang chờ'}</span></div><b>${s+(j===0&&state.tilePlaced?4:0)}<small>điểm</small></b></div>`).join('')}</div><div class="match-layout tile-layout"><section class="tiles-stage">${tilesBoard(state)}<div class="map-toolbar"><button class="icon-button" data-action="zoom-out" aria-label="Thu nhỏ bản đồ">${icon('minus')}</button><span>${Math.round((state.tileZoom||1)*100)}%</span><button class="icon-button" data-action="zoom-in" aria-label="Phóng to bản đồ">${icon('plus')}</button><button class="icon-button" data-action="center-map" aria-label="Đưa bản đồ về giữa">${icon('target')}</button></div></section><aside class="match-side"><section class="surface-panel tile-choice-panel"><span class="eyebrow">MẢNH GHÉP CỦA BẠN</span><h2>Một con đường mới</h2><div class="current-tile">${tileSvg(1,state.tileRotation||0)}</div>${button('Xoay mảnh ghép',{action:'rotate-tile',variant:'secondary',ico:'refresh',cls:'full-width'})}<p class="muted center">Nhấp ô nét đứt trên bản đồ để xem thao tác đặt mảnh mẫu.</p>${button(state.tilePlaced?'Đã đặt mảnh':'Đặt vào ô gợi ý',{action:'place-tile',ico:'check',cls:'full-width',disabled:state.tilePlaced})}</section><div class="surface-panel compact"><div class="row-between"><span>Túi mảnh ghép</span><strong>${state.tilePlaced?23:24} / 48</strong></div><div class="progress-line"><span style="width:50%"></span></div><p class="micro-copy">Điểm và vị trí chỉ dùng để mô phỏng giao diện.</p></div>${button('Kết thúc ván mẫu',{href:'result/tiles',variant:'text',ico:'flag'})}</aside></div>`;}
function werewolfScreen(state){const night=state.wolfNight;const players=['Bạn','Minh Anh','Hoàng Nam','Linh Chi','Tuấn Anh','Phương Thảo','Gia Huy','Ngọc Mai'];return `${breadcrumb('Thư viện game')}${pageHead('BÀN CHƠI · MA SÓI',night?'Khi ngôi làng ngủ.':'Ngôi làng thức giấc.',night?'Đêm thứ 2 · Lắng nghe những điều chưa được nói.':'Ngày thứ 2 · Cùng nhau tìm ra sự thật.',button(night?'Xem pha ban ngày':'Xem pha ban đêm',{action:'wolf-phase',variant:'tonal',ico:night?'sun':'moon'}))}<div class="wolf-layout"><section class="village-panel ${night?'night-phase':''}"><div class="village-status">${badge(night?'PHA ĐÊM':'THẢO LUẬN','neutral',night?'moon':'sun')}<span class="village-clock">01:42 <small>minh họa</small></span></div><div class="village-moon">${icon(night?'moon':'sun')}</div><h2>${night?'Mỗi người, một bí mật.':'Bạn tin tưởng ai?'}</h2><p>${night?'Thông tin vai trò chỉ xuất hiện trong phần riêng của bạn.':'Chọn người chơi để mô phỏng thao tác biểu quyết.'}</p><div class="village-players">${players.map((n,i)=>`<button class="village-player ${state.wolfVote===i?'voted':''}" data-action="wolf-vote" data-value="${i}" ${i===0?'disabled':''}>${avatar(i===0?'MD':n.split(' ').map(s=>s[0]).join(''),['lavender','peach','sage','mint'][i%4],'large')}<strong>${n}</strong><span>${state.wolfVote===i?'Bạn đã chọn':i===0?'Bạn đang chơi':'Còn trong làng'}</span>${state.wolfVote===i?icon('check'):''}</button>`).join('')}</div><div class="village-footer">${icon('shield')} Vai trò những người khác không được hiển thị.</div></section><aside class="match-side"><section class="role-card"><span class="eyebrow">CHỈ MÌNH BẠN THẤY</span><span class="role-illustration">${icon(state.roleRevealed?'eye':'lock')}</span><h2>${state.roleRevealed?'Tiên tri':'Vai trò của bạn'}</h2><p>${state.roleRevealed?'Ví dụ giao diện vai trò riêng. Chưa thực thi luật Ma sói.':'Nhấn để xem vai trò riêng trong bản mẫu.'}</p>${button(state.roleRevealed?'Ẩn vai trò':'Xem vai trò',{action:'reveal-role',variant:'secondary',ico:state.roleRevealed?'lock':'eye',cls:'full-width'})}</section><section class="surface-panel"><div class="section-heading"><h2>Chuyện trong làng</h2>${icon('message')}</div><div class="village-chat"><p><b>Minh Anh</b><span>Mọi người nghĩ sao về lượt vừa rồi?</span></p><p><b>Linh Chi</b><span>Mình muốn nghe Nam giải thích thêm.</span></p></div><div class="soft-notice">${icon('info')}<p>${night?'Chat công khai tạm khóa trong pha đêm mẫu.':'Tin nhắn và người chơi là dữ liệu minh họa.'}</p></div></section></aside></div>`;}
function resultScreen(id,state){const g=GAME_BY_ID[id]||GAMES[0];return `${breadcrumb('Ván của tôi','history')}<section class="result-hero"><span class="result-spark sp1">✧</span><span class="result-spark sp2">✦</span><span class="result-spark sp3">✧</span><div class="trophy-emblem">${icon('trophy')}</div><span class="eyebrow">MỘT VÁN CHƠI THẬT ĐẸP</span><h1>${id==='tiles'?'Một miền đất, nhiều niềm vui.':'Bạn đã có một ván thắng.'}</h1><p>Điều đáng nhớ không chỉ là kết quả,<br>mà còn là những gì bạn đã nhìn ra.</p><div class="result-match"><div>${avatar('MD','lavender','large')}<strong>Bạn</strong><span>${id==='tiles'?'68 điểm':id==='chess'?'Quân trắng':id==='caro'?'Quân X':'Quân đỏ'}</span></div><strong class="result-score">${id==='tiles'?'1':'1 — 0'}<small>${id==='tiles'?'XẾP HẠNG':'KẾT QUẢ MẪU'}</small></strong><div>${avatar('AI','sage','large')}<strong>Huấn luyện viên</strong><span>${g.name}</span></div></div><div class="result-metrics"><span>${icon('clock')} 18 phút 42 giây</span><span>${icon('layers')} ${id==='tiles'?'24 lượt':'32 nước đi'}</span><span>${icon('shield')} Luyện tập</span></div><div class="result-actions">${button('Cùng nhìn lại ván này',{href:`analysis/${id}`,ico:'chart'})}${button('Chơi thêm một ván',{href:`setup/${id}`,variant:'secondary',ico:'refresh'})}</div><p class="micro-copy">Kết quả được dựng sẵn để duyệt giao diện, không tính từ bàn mẫu.</p></section><div class="result-followups"><a class="mode-card" href="#learn/xiangqi"><span class="feature-icon lavender">${icon('spark')}</span><div><h3>Mỗi ván, một điều mới</h3><p>Hỏi gia sư về một nước đi khiến bạn tò mò.</p></div>${icon('arrow')}</a><a class="mode-card" href="#history"><span class="feature-icon sage">${icon('history')}</span><div><h3>Giữ lại hành trình</h3><p>Xem lại các ván đã lưu của bạn.</p></div>${icon('arrow')}</a></div><div class="center">${button('Về thư viện game',{href:'library',variant:'text',ico:'back'})}</div>`;}
function historyScreen(state){const filter=state.historyFilter;const list=MATCHES.filter(m=>filter==='all'||m.status===filter);return `${pageHead('HÀNH TRÌNH CỦA BẠN','Mỗi ván, một câu chuyện.','Tiếp tục một ván dở, hoặc nhìn lại một nước đi hay.',button('Nhập replay',{action:'import-replay',variant:'tonal',ico:'upload'}))}<div class="history-highlight"><div class="resume-art">${gameArt('xiangqi')}</div><div><span class="eyebrow">VÁN CHƯA KẾT THÚC</span><h2>Bàn cờ vẫn ở đây.</h2><p>Cờ tướng cùng huấn luyện viên · 12 nước đi</p><span class="text-success">${icon('check')} Đã lưu mẫu trên thiết bị</span></div>${button('Trở lại bàn cờ',{href:'play/xiangqi',ico:'arrow'})}</div><section class="surface-panel history-panel"><div class="section-heading"><div class="filter-row">${[['all','Tất cả'],['playing','Đang chơi'],['done','Đã kết thúc'],['saved','Đã lưu để học']].map(([v,n])=>`<button class="chip ${filter===v?'active':''}" data-action="history-filter" data-value="${v}" aria-pressed="${filter===v}">${n}</button>`).join('')}</div><span class="muted">${list.length} ván mẫu</span></div><div class="history-table"><div class="history-table-head"><span>Ván chơi</span><span>Đối thủ</span><span>Kết quả</span><span>Thời lượng</span><span></span></div>${list.map(m=>`<a class="history-row" href="#${m.status==='playing'?'play':'analysis'}/${m.game}"><div class="history-game"><span class="history-thumb ${GAME_BY_ID[m.game].tone}">${gameArt(m.game)}</span><span><strong>${m.title}</strong><small>${GAME_BY_ID[m.game].name} · ${m.date}</small></span></div><span class="history-opponent">${m.opponent}</span><span>${badge(m.result,m.status==='playing'?'purple':m.status==='saved'?'neutral':'green')}</span><span class="history-duration">${m.time}<small>${m.moves}</small></span>${icon('chevron')}</a>`).join('')}</div>${!list.length?emptyState('Chưa có ván nào ở đây','Các ván bạn lưu sẽ xuất hiện tại đây.'):''}</section><div class="gentle-note">${icon('folder')} Dữ liệu minh họa. Không có đồng bộ tài khoản hay replay thật trong prototype.</div>`;}
function toggleRow(label,desc,key,state,ico){return `<div class="setting-row"><div class="row gap-16">${ico?`<span class="setting-icon">${icon(ico)}</span>`:''}<div><strong>${label}</strong><p>${desc}</p></div></div><button role="switch" aria-checked="${!!state.prefs[key]}" aria-label="${label}" class="switch ${state.prefs[key]?'on':''}" data-action="toggle-setting" data-value="${key}"><span>${state.prefs[key]?icon('check'):''}</span></button></div>`;}

a-settings"><h2>Dữ liệu & riêng tư</h2><div class="setting-row"><div class="row gap-16"><span class="setting-icon">${icon('shield')}</span><div><strong>Chỉ trên trình duyệt này</strong><p>Prototype không gửi dữ liệu đến máy chủ.</p></div></div>${badge('Local','green')}</div><div class="setting-row"><div><strong>Đặt lại bản mẫu</strong><p>Xóa cài đặt, yêu thích và tương tác mẫu đã lưu.</p></div>${button('Đặt lại',{action:'reset-demo',variant:'danger'})}</div><a href="#design-system" class="setting-row link-row"><span><strong>Bộ thành phần & token</strong><p>Xem bảng màu, trạng thái và cấu trúc giao diện.</p></span>${icon('arrow')}</a></section></div></div>`;}
function resourcesScreen(id,state){const g=GAME_BY_ID[id]||GAMES[0];return `${breadcrumb(g.name,`game/${g.id}`)}${pageHead('TÀI NGUYÊN CỦA GAME','Sẵn sàng, theo nhu cầu.','Bật thêm khả năng khi bạn cần. Không tự tải hay chuyển sang cloud.',badge('Quản lý local','green','shield'))}<section class="resource-banner"><span class="feature-icon sage">${icon('leaf')}</span><div><h2>Chơi trước. Mở rộng sau.</h2><p>Luật và bàn chơi độc lập với engine, gia sư hoặc dịch vụ bên ngoài.</p></div><span class="resource-banner-art">${icon('layers')}</span></section><div class="resource-cards"><section class="resource-card"><div class="row-between"><span class="feature-icon lavender">${icon('grid')}</span>${badge('Có trong bản mẫu','green','check')}</div><h2>Bàn chơi & hình ảnh</h2><p>Bàn cờ, quân cờ và giao diện SVG. Được đóng gói cùng prototype.</p><dl><div><dt>Nguồn</dt><dd>Asset minh họa tự tạo</dd></div><div><dt>Kết nối</dt><dd>Không cần mạng</dd></div></dl>${button('Mở bàn chơi',{href:`play/${g.id}`,variant:'secondary',ico:'play',cls:'full-width'})}</section><section class="resource-card"><div class="row-between"><span class="feature-icon sage">${icon('cpu')}</span>${badge(state.engineInstalled?'Đã cài (mô phỏng)':'Chưa cài','neutral')}</div><h2>Engine phân tích</h2><p>Đề xuất nước đi và đánh giá thế cờ. Provider, artifact và điều kiện phân phối cần chốt khi triển khai.</p><dl><div><dt>Vai trò</dt><dd>Chơi & phân tích</dd></div><div><dt>Trạng thái</dt><dd>UI minh họa</dd></div></dl>${button(state.engineInstalled?'Gỡ trạng thái mẫu':'Mô phỏng cài đặt',{action:'install-engine',variant:state.engineInstalled?'secondary':'primary',ico:'download',cls:'full-width'})}</section><section class="resource-card"><div class="row-between"><span class="feature-icon peach">${icon('spark')}</span>${badge('Tùy chọn','purple')}</div><h2>Giải thích bằng lời</h2><p>Diễn giải dựa trên dữ liệu phân tích. Không thay luật game, không tự quyết định nước đi.</p><dl><div><dt>Nội dung demo</dt><dd>Phản hồi d function authScreen(register,state){return `<div class="auth-layout"><section class="auth-story"><a class="auth-brand" href="#library">${brandMark()}<span>tabula</span></a><div><span class="eyebrow">MỘT BÀN CHƠI. NHIỀU KẾT NỐI.</span><h1>Niềm vui lớn,<br>từ một ván nhỏ.</h1><p>Chơi cùng bạn bè, lưu lại hành trình<br>và khám phá điều mới mỗi ngày.</p></div><div class="auth-art">${gameArt('chess','detail-illustration')}</div><span class="auth-story-footer">Cứ ngồi xuống. Luôn có một chỗ dành cho bạn.</span></section><section class="auth-form-side">${breadcrumb('Trở lại thư viện')}<div class="auth-form-wrap"><span class="eyebrow">${register?'RẤT VUI ĐƯỢC GẶP BẠN':'CHÀO BẠN TRỞ LẠI'}</span><h2>${register?'Cùng bắt đầu nhé.':'Bàn chơi đang đợi.'}</h2><p>${register?'Tạo hồ sơ để kết nối với những người bạn mới.':'Đăng nhập để tiếp tục hành trình của bạn.'}</p><form id="auth-form" data-register="${register}">${register?'<label class="input-label">Tên hiển thị<input type="text" name="displayName" placeholder="Bạn muốn mọi người gọi là gì?" autocomplete="nickname" required maxlength="40"></label>':''}<label class="input-label">Email<input type="email" name="email" placeholder="ban@example.com" autocomplete="email" required></label><label class="input-label">Mật khẩu mẫu<span class="password-field"><input id="password" type="password" name="password" placeholder="Chỉ dùng mật khẩu thử, không dùng mật khẩu thật" minlength="6" required autocomplete="off"><button type="button" class="icon-button" data-action="show-password" aria-label="Hiện hoặc ẩn mật khẩu">${icon('eye')}</button></span></label>${register?'<label class="check-label"><input type="checkbox" required> Tôi hiểu đây là form minh họa, không tạo tài khoản thật.</label>':`<div class="auth-options"><label class="check-label"><input type="checkbox"> Ghi nhớ phiên mẫu</label><button type="button" class="text-button" data-action="forgot-password">Quên mật khẩu?</button></div>`}<button class="btn btn-primary full-width" type="submit">${register?'Tạo hồ sơ mẫu':'Đăng nhập mẫu'}${icon('arrow')}</button></form><div class="auth-separator"><span>hoặc cứ bắt đầu chơi</span></div>${button('Tiếp tục không cần tài khoản',{href:'library',variant:'secondary',ico:'play',cls:'full-width'})}<p class="auth-switch">${register?'Đã có tài khoản?':'Lần đầu ghé Tabula?'} <a href="#${register?'login':'register'}">${register?'Đăng nhập':'Tạo tài khoản'}</a></p><div class="soft-notice">${icon('shield')}<p>Không gửi hay lưu mật khẩu. Mọi thao tác chỉ mô phỏng trên trình duyệt.</p></div></div></section></div>`;}

function designSystemScreen(state){return `${pageHead('TABULA · DESIGN FOUNDATION','Chung một ngôn ngữ.','M3 Expressive-inspired · semantic token từ repository, bổ sung lớp prototype.',button('Danh sách màn hình',{action:'screen-index',variant:'tonal',ico:'grid'}))}<div class="design-intro"><span class="eyebrow">CHỦ ĐÍCH THIẾT KẾ</span><h2>Ấm áp như một bàn chơi.<br>Rõ ràng như một nước đi.</h2><p>Nền giấy sáng, nhịp thở rộng, màu tím có tiết chế. Các game có cá tính riêng, nhưng điều hướng và hành vi luôn quen thuộc.</p></div><section class="surface-panel"><div class="section-heading"><h2>Màu sắc có vai trò</h2><span class="muted">tokens.toml → CSS variables</span></div><div class="swatches">${[['primary','Chủ đạo','#5634BE'],['surface','Bề mặt','#FFFBFF'],['container','Lớp nền','#F4EDF7'],['on-surface','Nội dung','#1E1C21'],['success','Sẵn sàng','#106F3D'],['danger','Lỗi','#BA1A1A']].map(([v,n,h])=>`<div><span class="swatch" style="background:var(--${v})"></span><strong>${n}</strong><code>${h}</code></div>`).join('')}</div></section><div class="design-columns"><section class="surface-panel"><h2>Kiểu chữ</h2><div class="type-display">Mỗi nước đi,<br>một câu chuyện.</div><p>Serif cho những khoảnh khắc cảm xúc. Sans-serif cho thông tin và thao tác.</p><code>Georgia / ui-serif · system-ui / ui-sans-serif</code><p class="micro-copy">Không đóng gói font. Hiển thị có thể khác nhẹ giữa thiết bị.</p></section><section class="surface-panel"><h2>Thành phần tương tác</h2><div class="component-samples">${button('Bắt đầu một ván',{action:'sample-toast',ico:'play'})}${button('Khám phá',{action:'sample-toast',variant:'tonal',ico:'arrow'})}${button('Tùy chọn',{action:'sample-toast',variant:'secondary',ico:'settings'})}${button('Chưa sẵn sàng',{disabled:true})}</div><div class="component-samples">${badge('Đã lưu','green','check')}${badge('Luyện tập','purple')}${badge('Thiếu tài nguyên','warning','info')}</div>${toggleRow('Công tắc minh họa','Trạng thái ghi nhớ trên trình duyệt.','sound',state)}</section></div><section class="surface-panel section-spaced"><h2>Trạng thái cũng cần được thiết kế</h2><div class="component-samples">${button('Đang tải tài nguyên',{action:'loading-demo',variant:'secondary',ico:'download'})}${button('Mất kết nối',{action:'connection-demo',variant:'secondary',ico:'wifi'})}${button('Trạng thái trống',{action:'empty-demo',variant:'secondary',ico:'folder'})}${button('Xác nhận thao tác',{action:'reset-demo',variant:'secondary',ico:'shield'})}</div><p class="muted">Nút rõ nghĩa, focus nhìn thấy, modal hỗ trợ Escape, chuyển động theo tùy chọn thiết bị, bố cục đáp ứng trên mobile.</p></section>`;}
function screenContent(route,state){const [screen,id]=route.split('/');switch(screen){case'library':return libraryScreen(state);case'game':return detailScreen(id,state);case'setup':return setupScreen(id,state);case'play':return playScreen(id,state);case'result':return resultScreen(id,state);case'history':return historyScreen(state);case'analysis':return analysisScreen(id,state);case'learn':return learnScreen(id,state);case'settings':return settingsScreen(state);case'resources':return resourcesScreen(id,state);case'login':return authScreen(false,state);case'register':return authScreen(true,state);case'rooms':return roomsScreen(state);case'room':return roomScreen(state);case'queue':return queueScreen(state);case'profile':return profileScreen(state);case'friends':return friendsScreen(state);case'design-system':return designSystemScreen(state);default:return `${pageHead('TRANG CHƯA CÓ','Lạc một nước, không sao.','Quay lại thư viện để bắt đầu một ván mới.')}${button('Về thư viện',{href:'library',ico:'back'})}`;}}

function genericReplayScreen(id,state){const g=GAME_BY_ID[id]||GAMES[2];const board=id==='tiles'?tilesBoard(state):id==='caro'?caroBoard(state):'<div class="surface-panel">'+emptyState('Replay có thông tin riêng','Khi triển khai Ma sói, replay phải tuân thủ quyền xem và quy tắc lộ vai trò.')+'</div>';return `${breadcrumb('Ván của tôi','history')}${pageHead('REPLAY · '+g.name.toUpperCase(),'Chậm lại một lượt.','Dòng sự kiện minh họa, không phải bản tái tạo ván thật.')}<div class="match-layout"><section class="board-column"><div class="analysis-context"><span>${icon('history')} Xem lại ván mẫu</span>${badge('Lượt '+(state.replayStep+1),'purple')}</div>${board}<div class="timeline-control">${replayControls()}<input type="range" min="0" max="5" value="${state.replayStep}" id="replay-slider" aria-label="Vị trí replay"><span>${state.replayStep+1} / 6</span></div></section><aside class="match-side"><section class="surface-panel"><h2>Dòng sự kiện</h2>${['Bắt đầu ván','Người chơi thứ nhất thực hiện lượt','Chuyển lượt','Người chơi thứ hai thực hiện lượt','Cập nhật bàn chơi','Chờ lượt tiếp theo'].map((text,i)=>`<button class="candidate ${i===state.replayStep?'chosen':''}" data-action="select-move" data-value="${i}"><span class="candidate-number">${i+1}</span><span><strong>${text}</strong><small>Sự kiện giao diện minh họa</small></span></button>`).join('')}</section><div class="soft-notice">${icon('shield')}<p>Chỉ hiển thị capability game hỗ trợ. Không gắn engine cờ tướng vào replay của game khác.</p></div>${button('Chơi một ván mới',{href:'setup/'+g.id,ico:'play'})}</aside></div>`;}

/** Vanilla JS UI controller. No network calls, real engine, or account integration. */
const STORAGE_KEY='tabula.design.v1';
const DEFAULT_PREFS={theme:'light',sound:true,reducedMotion:false,contrast:false};
function readSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return {}}}
const saved=readSaved();
const state={
 prefs:{...DEFAULT_PREFS,...saved.prefs},favorites:Array.isArray(saved.favorites)?saved.favorites:['xiangqi','chess'],
 displayName:saved.displayName||'Mạnh Duy',gameFilter:'all',gameSearch:'',historyFilter:'all',roomFilter:'all',friendFilter:'all',
 setup:{mode:'bot',time:'15',level:'balanced',side:'red',...saved.setup},
 chess:CHESS_INITIAL.map(r=>[...r]),xiangqi:XIANGQI_INITIAL.map(p=>[...p]),caro:null,
 selectedChess:null,chessTargets:[],selectedXq:null,demoMoves:[],replayStep:5,
 analysisArrow:false,boardFlipped:false,tileRotation:0,tilePlaced:false,tileZoom:1,
 wolfNight:false,wolfVote:null,roleRevealed:false,chat:[],roomChat:[],roomGame:'chess',roomName:'',ready:false,
 engineInstalled:false,cpuBudget:25,friendAccepted:false,menuOpen:false
};
let currentRoute='',toastTimer,activeModal=null,lastModalFocus=null;
const routeNames={library:'Thư viện game',game:'Chi tiết game',setup:'Thiết lập ván',play:'Bàn chơi',result:'Kết quả ván',history:'Ván của tôi',analysis:'Phân tích',learn:'Gia sư',settings:'Cài đặt',resources:'Tài nguyên game',rooms:'Phòng chơi',room:'Phòng chờ',queue:'Ghép trận',profile:'Hồ sơ',friends:'Bạn bè','design-system':'Bộ thành phần'};
const VALID_SCREENS=new Set([...Object.keys(routeNames),'login','register']);
function safeSave(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({prefs:state.prefs,favorites:state.favorites,displayName:state.displayName,setup:state.setup}))}catch{/* File URLs / privacy mode may disallow persistence; UI remains usable. */}}
function applyPreferences(){let theme=state.prefs.theme;if(theme==='system')theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.dataset.motion=state.prefs.reducedMotion?'off':'on';document.documentElement.dataset.contrast=state.prefs.contrast?'high':'normal';}
function getRoute(){const raw=location.hash.slice(1).replace(/^\//,'')||'library';return raw==='main-content'?currentRoute||'library':raw;}
function navLink(route,ico,label,count=''){const active=currentRoute===route||route==='library'&&['game','setup','play','learn','analysis','result','resources'].includes(currentRoute.split('/')[0]);return `<a href="#${route}" class="nav-link ${active?'active':''}" ${active?'aria-current="page"':''} aria-label="${label}">${icon(ico)}<span>${label}</span>${count?`<span class="nav-count">${count}</span>`:''}</a>`;}
function shell(content){const screen=currentRoute.split('/')[0];const nav=[['library','grid','Thư viện'],['history','history','Ván của tôi'],['rooms','users','Phòng chơi'],['friends','heart','Bạn bè']];return `
 <button class="shell-scrim ${state.menuOpen?'is-open':''}" data-action="close-menu" aria-label="Đóng menu"></button>
 <aside class="sidebar ${state.menuOpen?'is-open':''}" aria-label="Điều hướng chính"><a class="brand" href="#library" aria-label="Tabula · Thư viện">${brandMark()}<span class="brand-name">tabula</span></a><nav class="sidebar-group">${nav.map(([r,i,l])=>navLink(r,i,l,r==='history'?'2':'')).join('')}</nav><div class="nav-caption">BÀN CHƠI QUEN THUỘC</div><a class="nav-link pinned-link" href="#game/xiangqi"><i class="pinned-token">帥</i><span>Xiangqi Tutor</span></a><a class="nav-link pinned-link" href="#game/chess"><i class="pinned-token chess">♞</i><span>Cờ vua</span></a><div class="sidebar-spacer"></div><div class="sidebar-note">${icon('leaf')}<p>Chơi chậm lại.<br>Kết nối nhiều hơn.</p><small>Một khoảng nghỉ cho riêng bạn.</small></div><nav class="sidebar-group">${navLink('settings','settings','Cài đặt')}<button class="nav-link" data-action="screen-index" aria-label="Xem toàn bộ 22 màn hình">${icon('layers')}<span>Tất cả màn hình</span></button></nav><a href="#profile" class="sidebar-profile">${avatar('MD','lavender')}<div><strong>${escapeHtml(state.displayName)}</strong><small>Hồ sơ minh họa</small></div>${icon('chevron')}</a></aside>
 <div class="main-shell"><header class="topbar"><a href="#library" class="mobile-brand">${brandMark()}<span>tabula</span></a><div class="topbar-context">${icon('grid')}<span>Không gian chơi</span><span>/</span><span>${routeNames[screen]||'Tabula'}</span></div><div class="topbar-actions"><span class="prototype-pill">DESIGN PROTOTYPE</span><span class="online-indicator"><i class="status-dot"></i> Sẵn sàng chơi local</span><span class="topbar-divider"></span><button class="icon-button" data-action="notifications" aria-label="Thông báo mẫu">${icon('bell')}</button><a href="#profile" class="avatar lavender" aria-label="Hồ sơ">MD</a><button class="icon-button mobile-menu-button" data-action="toggle-menu" aria-label="Mở menu" aria-expanded="${state.menuOpen}">${icon('menu')}</button></div></header>
 <main class="main-content" id="main-content" tabindex="-1">${content}<footer class="page-footer"><span>Tabula · Thiết kế 01 &nbsp; / &nbsp; Dữ liệu minh họa</span><span class="footer-links"><a href="#design-system">Bộ thành phần</a><a href="gallery.html">Bản đồ màn hình ↗</a></span></footer></main></div>
 <nav class="mobile-nav" aria-label="Điều hướng mobile">${[...nav.slice(0,3),['settings','settings','Cài đặt']].map(([r,i,l])=>{const active=currentRoute===r||r==='library'&&['game','setup','play','analysis','learn','result','resources'].includes(screen);return `<a href="#${r}" class="${active?'active':''}" ${active?'aria-current="page"':''}><span>${icon(i)}</span><span>${l}</span></a>`}).join('')}</nav>`;}
function render({keepScroll=false}={}){const x=window.scrollX,y=window.scrollY;currentRoute=getRoute();const [screen,id]=currentRoute.split('/');if(screen==='setup'&&GAME_BY_ID[id]&&!GAME_BY_ID[id].modes.includes(state.setup.mode))state.setup.mode=GAME_BY_ID[id].modes[0];applyPreferences();document.body.dataset.screen=screen;const content=screenContent(currentRoute,state);document.getElementById('app').innerHTML=['login','register'].includes(screen)?content:shell(content);document.title=`${routeNames[screen]|| (screen==='login'?'Đăng nhập':screen==='register'?'Tạo tài khoản':'Tabula')} · Tabula`;if(screen==='library')filterGames();if(keepScroll)window.scrollTo(x,y);}
function go(route){state.menuOpen=false;if(location.hash==='#'+route){render();window.scrollTo(0,0)}else location.hash=route;}
function toast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.innerHTML=`${icon('check')}<span>${escapeHtml(message)}</span>`;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),4300);}
function openModal(title,body){closeModal(false);lastModalFocus=document.activeElement;const root=document.getElementById('modal-root');root.innerHTML=`<dialog aria-labelledby="dialog-title"><div class="modal-header"><h2 id="dialog-title">${title}</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Đóng">${icon('close')}</button></div><div class="modal-body">${body}</div></dialog>`;activeModal=root.querySelector('dialog');activeModal.showModal();activeModal.addEventListener('close',()=>{root.innerHTML='';activeModal=null;lastModalFocus?.focus?.()},{once:true});activeModal.addEventListener('click',e=>{if(e.target===activeModal){const r=activeModal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});}
function closeModal(restore=true){if(activeModal){activeModal.close();activeModal=null;}document.getElementById('modal-root').innerHTML='';if(restore)lastModalFocus?.focus?.();}
function filterGames(){const q=(state.gameSearch||'').trim().toLocaleLowerCase('vi');let visible=0;document.querySelectorAll('#game-grid .game-card').forEach((card,i)=>{const game=GAMES[i];const matchCategory=state.gameFilter==='all'||state.gameFilter===game.category||state.gameFilter==='favorite'&&state.favorites.includes(game.id);card.hidden=!(matchCategory&&(game.name+' '+game.label).toLocaleLowerCase('vi').includes(q));if(!card.hidden)visible++});const empty=document.getElementById('game-empty');if(empty)empty.hidden=visible>0;}
function addChat(text){const clean=text.trim().slice(0,500);if(!clean)return;state.chat.push({role:'user',text:clean});state.chat.push({role:'assistant',text:'Đây là phản hồi dựng sẵn để bạn duyệt UI. Trong sản phẩm thật, lời giải cần dựa trên đúng thế cờ và dữ liệu engine. Bạn có thể bấm “Xem đường đi minh họa” để thử liên kết lời giải với bàn cờ.'});render({keepScroll:true});const chat=document.getElementById('chat-messages');if(chat)chat.scrollTop=chat.scrollHeight;}
function showLoading(){openModal('Chuẩn bị bàn chơi',`<div class="loader-ring"></div><p class="center">Đây là trạng thái tải minh họa. Không tải tài nguyên từ Internet.</p><div class="row-between"><span class="micro-copy">Bàn cờ & quân cờ · ví dụ</span><b id="load-progress">35%</b></div><div class="progress-line"><span id="load-bar" style="width:35%"></span></div><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}${button('Hoàn tất mẫu',{action:'finish-loading',ico:'check'})}</div>`)}
const actions={
 'toggle-menu':()=>{state.menuOpen=!state.menuOpen;render({keepScroll:true})},'close-menu':()=>{state.menuOpen=false;render({keepScroll:true})},'close-modal':()=>closeModal(),
 'favorite':v=>{state.favorites=state.favorites.includes(v)?state.favorites.filter(x=>x!==v):[...state.favorites,v];safeSave();render({keepScroll:true});toast(state.favorites.includes(v)?'Đã thêm vào trò chơi yêu thích.':'Đã bỏ khỏi trò chơi yêu thích.')},
 'game-filter':v=>{state.gameFilter=v;render({keepScroll:true})},'history-filter':v=>{state.historyFilter=v;render({keepScroll:true})},'room-filter':v=>{state.roomFilter=v;render({keepScroll:true})},'friend-filter':v=>{state.friendFilter=v;render({keepScroll:true})},
 'start-match':v=>{safeSave();state.demoMoves=[];state.replayStep=5;if(state.setup.mode==='online'){state.roomGame=v;state.ready=false;go('room')}else go('play/'+v)},
 'theme':v=>{state.prefs.theme=v;safeSave();render({keepScroll:true});toast('Đã đổi giao diện của prototype.')},
 'toggle-setting':v=>{state.prefs[v]=!state.prefs[v];safeSave();render({keepScroll:true})},
 'scroll-section':v=>{document.getElementById(v)?.scrollIntoView({behavior:state.prefs.reducedMotion?'instant':'smooth',block:'start'})},
 'reset-demo':()=>openModal('Đặt lại bản mẫu?',`<p>Xóa cài đặt, game yêu thích và tương tác mẫu trên trình duyệt này. Không ảnh hưởng source hoặc dữ liệu bên ngoài.</p><div class="modal-actions">${button('Giữ nguyên',{action:'close-modal',variant:'secondary'})}${button('Đặt lại',{action:'confirm-reset',variant:'danger'})}</div>`),
 'confirm-reset':()=>{try{localStorage.removeItem(STORAGE_KEY)}catch{}closeModal();location.hash='library';location.reload()},
 'select-move':v=>{state.replayStep=Number(v);state.analysisArrow=Number(v)%2===0;render({keepScroll:true});toast('Đã chọn lượt '+(Number(v)+1)+' trong replay mẫu.')},
 'replay-first':()=>{state.replayStep=0;state.analysisArrow=false;render({keepScroll:true})},'replay-last':()=>{state.replayStep=5;state.analysisArrow=true;render({keepScroll:true})},
 'replay-prev':()=>{state.replayStep=Math.max(0,state.replayStep-1);state.analysisArrow=state.replayStep%2===0;render({keepScroll:true})},'replay-next':()=>{state.replayStep=Math.min(5,state.replayStep+1);state.analysisArrow=state.replayStep%2===0;render({keepScroll:true})},
 'show-line':()=>{state.analysisArrow=!state.analysisArrow;render({keepScroll:true});toast(state.analysisArrow?'Đã hiện đường đi minh họa. Không phải kết quả engine.':'Đã ẩn đường đi minh họa.')},
 'save-analysis':()=>{toast('Đã đánh dấu nhánh mẫu. Prototype không xuất replay thật.')},
 'flip-board':()=>{state.boardFlipped=!state.boardFlipped;render({keepScroll:true})},
 'reset-board':v=>{state.chess=CHESS_INITIAL.map(r=>[...r]);state.xiangqi=XIANGQI_INITIAL.map(p=>[...p]);state.caro=null;state.selectedChess=null;state.chessTargets=[];state.selectedXq=null;state.demoMoves=[];state.boardFlipped=false;render({keepScroll:true});toast('Đã đặt lại bàn '+(GAME_BY_ID[v]?.name||'chơi')+' mẫu.')},
 'fullscreen':()=>{const el=document.getElementById('board-stage');if(document.fullscreenElement)document.exitFullscreen?.();else if(el?.requestFullscreen)el.requestFullscreen().catch(()=>toast('Trình duyệt không cho phép toàn màn hình.'));else toast('Thiết bị này không hỗ trợ toàn màn hình.')},
 'board-settings':()=>openModal('Một bàn chơi dễ chịu',`<p>Các tùy chọn được áp dụng cho prototype. Tương tác bàn cờ không thực thi luật game thật.</p><div class="modal-actions">${button('Lật bàn cờ',{action:'modal-flip',variant:'secondary',ico:'refresh'})}${button('Cài đặt đầy đủ',{href:'settings',variant:'tonal',ico:'settings'})}</div>`),
 'modal-flip':()=>{state.boardFlipped=!state.boardFlipped;closeModal();render({keepScroll:true})},
 'chat-prompt':v=>addChat(v),'reset-chat':()=>{state.chat=[];state.analysisArrow=false;render({keepScroll:true});toast('Đã mở lại hội thoại mẫu.')},
 'rotate-tile':()=>{state.tileRotation=(state.tileRotation+90)%360;render({keepScroll:true})},'place-tile':()=>{if(state.tilePlaced)return;state.tilePlaced=true;render({keepScroll:true});toast('Đã đặt mảnh minh họa. Điểm +4 cũng là số liệu mẫu.')},
 'zoom-in':()=>{state.tileZoom=Math.min(1.5,state.tileZoom+.1);render({keepScroll:true})},'zoom-out':()=>{state.tileZoom=Math.max(.6,state.tileZoom-.1);render({keepScroll:true})},'center-map':()=>{state.tileZoom=1;render({keepScroll:true})},
 'wolf-phase':()=>{state.wolfNight=!state.wolfNight;state.wolfVote=null;render({keepScroll:true})},'wolf-vote':v=>{if(state.wolfNight){toast('Pha đêm mẫu: không biểu quyết công khai.');return;}state.wolfVote=Number(v);render({keepScroll:true});toast('Đã chọn người chơi trong biểu quyết mẫu.')},
 'reveal-role':()=>{state.roleRevealed=!state.roleRevealed;render({keepScroll:true})},
 'install-engine':()=>{if(state.engineInstalled){state.engineInstalled=false;render({keepScroll:true});toast('Đã gỡ trạng thái cài đặt mẫu. Không có engine nào bị xóa.')}else openModal('Mô phỏng cài engine',`<div class="modal-art">${icon('cpu')}</div><p>Không tải binary hay model. Xác nhận chỉ thay đổi trạng thái giao diện để bạn kiểm tra hành trình cài đặt.</p><div class="soft-notice">${icon('shield')}<p>Provider, phiên bản, dung lượng và quyền phân phối phải được kiểm tra khi triển khai thật.</p></div><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}${button('Hoàn tất mô phỏng',{action:'confirm-install',ico:'check'})}</div>`)},
 'confirm-install':()=>{state.engineInstalled=true;closeModal();render({keepScroll:true});toast('Đã cập nhật trạng thái cài đặt minh họa.')},
 'show-password':()=>{const el=document.getElementById('password');if(el)el.type=el.type==='password'?'text':'password'},
 'forgot-password':()=>openModal('Khôi phục tài khoản',`<p>Đây là trạng thái minh họa. Prototype không gửi email hoặc khôi phục tài khoản thật.</p><label class="input-label">Email<input type="email" placeholder="ban@example.com"></label><div class="modal-actions">${button('Quay lại',{action:'close-modal',variant:'secondary'})}${button('Xem thông báo mẫu',{action:'mock-reset-email',ico:'mail'})}</div>`),
 'mock-reset-email':()=>{closeModal();toast('Thông báo mẫu: hướng dẫn khôi phục sẽ được gửi nếu tài khoản tồn tại.')},
 'create-room':()=>openModal('Một bàn chơi mới',`<p>Tạo phòng mẫu để xem luồng mời bạn và sẵn sàng.</p><form id="create-room-form"><label class="input-label">Game<select name="game">${GAMES.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select></label><label class="input-label">Tên phòng<input name="roomName" value="Một ván cùng bạn" maxlength="60" required></label><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}<button class="btn btn-primary" type="submit">Tạo phòng mẫu ${icon('arrow')}</button></div></form>`),
 'join-room':(v,el)=>{state.roomGame=v;state.roomName=el?.closest('.room-card')?.querySelector('h3')?.textContent||'';state.ready=false;go('room')},
 'join-code':()=>openModal('Bạn có một lời mời?',`<p>Nhập mã <b>TB-2086</b> để mở phòng minh họa.</p><form id="join-code-form"><label class="input-label">Mã phòng<input name="code" placeholder="TB-2086" required pattern="[Tt][Bb]-2086" title="Mã phòng mẫu là TB-2086" maxlength="10"></label><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}<button class="btn btn-primary" type="submit">Vào phòng ${icon('arrow')}</button></div></form>`),
 'copy-room':()=>{const text='TB-2086';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('Đã sao chép mã TB-2086. Đây là phòng mẫu.')).catch(()=>showRoomCode());else showRoomCode()},
 'toggle-ready':()=>{state.ready=!state.ready;render({keepScroll:true})},'start-room':()=>{if(!state.ready){toast('Hãy đánh dấu sẵn sàng trước.');return;}go('play/'+state.roomGame);toast('Đang mở bàn mẫu, chưa kết nối người chơi thật.')},
 'mock-match-found':()=>{state.roomGame='chess';state.ready=false;go('room');toast('Đã tìm thấy phòng mẫu. Đây không phải kết quả ghép trận thật.')},
 'accept-friend':()=>{state.friendAccepted=true;render({keepScroll:true});toast('Đã chấp nhận lời mời mẫu. Không gửi thông báo thật.')},
 'invite-friend':v=>openModal('Mời '+escapeHtml(v)+' chơi?',`<p>Lời mời này chỉ xuất hiện trong prototype, không được gửi ra ngoài.</p><div class="dialog-code">TB-2086</div><div class="modal-actions">${button('Để sau',{action:'close-modal',variant:'secondary'})}${button('Mở phòng mẫu',{href:'room',ico:'arrow'})}</div>`),
 'add-friend':()=>openModal('Thêm một người bạn',`<p>Tìm theo tên hoặc tài khoản. Đây là form giao diện mẫu.</p><form id="add-friend-form"><label class="input-label">Tên người bạn<input name="name" placeholder="Ví dụ: Ngọc Mai" required maxlength="40"></label><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}<button type="submit" class="btn btn-primary">Gửi lời mời mẫu ${icon('plus')}</button></div></form>`),
 'edit-profile':()=>openModal('Bạn muốn được gọi là gì?',`<p>Tên hiển thị được lưu trên trình duyệt này. Không cập nhật tài khoản thật.</p><form id="profile-form"><label class="input-label">Tên hiển thị<input name="displayName" value="${escapeHtml(state.displayName)}" required maxlength="40"></label><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}<button class="btn btn-primary" type="submit">Lưu tên ${icon('check')}</button></div></form>`),
 'screen-index':()=>openModal('22 màn hình để khám phá',`<p>Chuyển trực tiếp đến từng màn. Tất cả đều có ảnh desktop và mobile trong bộ ZIP.</p><div class="screen-index-list">${SCREEN_INDEX.map(([file,route,title,desc],i)=>`<a href="#${route}"><span>${String(i+1).padStart(2,'0')}</span><span><b>${title}</b><small>${desc}</small></span>${icon('arrow')}</a>`).join('')}</div>`),
 'notifications':()=>openModal('Một lời chào từ Tabula',`<div class="modal-art">${icon('bell')}</div><p>Chưa có thông báo thật. Đây là khu vực dành cho lời mời chơi, lượt đến bạn và cập nhật game khi kết nối backend.</p>${button('Xem bạn bè mẫu',{href:'friends',variant:'tonal',ico:'users',cls:'full-width'})}`),
 'rules':v=>openModal('Làm quen với '+(GAME_BY_ID[v]?.name||'game'),`<p>Phần này minh họa cách trình bày hướng dẫn. Luật đầy đủ phải lấy từ module game và phiên bản tương ứng.</p><ol class="modal-rule-list"><li>Chọn chế độ phù hợp: local, bot hoặc online nếu game hỗ trợ.</li><li>Quan sát chỉ báo lượt, thời gian và các thao tác trên bàn.</li><li>Trong sản phẩm thật, mọi nước đi đều phải qua kiểm tra luật.</li><li>Sau ván, xem lại hoặc mở nhánh phân tích riêng để học.</li></ol><div class="modal-actions">${button('Đã hiểu',{action:'close-modal',ico:'check'})}</div>`),
 'lessons':()=>openModal('Những bước nhỏ đầu tiên',`<p>Đề xuất bài học cho giai đoạn sau. Chưa có thư viện bài tập thật.</p><div class="screen-index-list">${[['01','Làm quen với quân cờ','Luật đi và vị trí ban đầu'],['02','Cùng nhìn vào trung tâm','Quan sát trước khi lựa chọn'],['03','Học từ ván vừa chơi','Nhìn lại những thời điểm quan trọng']].map(([n,t,d])=>`<a href="#learn/xiangqi"><span>${n}</span><span><b>${t}</b><small>${d}</small></span>${icon('book')}</a>`).join('')}</div>`),
 'import-position':()=>openModal('Mở một thế cờ',`<p>Form để duyệt UI. Prototype không parse hoặc kiểm định notation/FEN.</p><label class="input-label">Notation / FEN<textarea rows="3" placeholder="Dán thế cờ tại đây để xem bố cục form…"></textarea></label><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}${button('Mở thế cờ mẫu',{action:'open-sample-position',ico:'arrow'})}</div>`),
 'open-sample-position':()=>{closeModal();state.analysisArrow=true;go('analysis/xiangqi');toast('Đã mở thế cờ mẫu có sẵn, không xử lý dữ liệu vừa dán.')},
 'import-replay':()=>openModal('Đưa một ván vào hành trình',`<div class="modal-art">${icon('upload')}</div><p>Luồng nhập replay cần kiểm tra game, version và nội dung khi triển khai. Bản thiết kế chỉ mở replay đã dựng sẵn.</p><div class="modal-actions">${button('Hủy',{action:'close-modal',variant:'secondary'})}${button('Mở replay mẫu',{href:'analysis/xiangqi',ico:'arrow'})}</div>`),
 'sample-toast':()=>toast('Đây là phản hồi của một thành phần mẫu.'),
 'loading-demo':()=>showLoading(),'finish-loading':()=>{closeModal();toast('Đã hoàn tất trạng thái mẫu. Không có tài nguyên được tải.')},
 'connection-demo':()=>openModal('Kết nối vừa gián đoạn',`<div class="modal-art">${icon('wifi')}</div><p>Ví dụ thông báo cho ván online. Khi triển khai, cần khôi phục trạng thái từ server trước khi cho người chơi đi tiếp.</p><div class="soft-notice">${icon('shield')}<p>Không tự chuyển ván online thành ván local hoặc giả báo đã kết nối.</p></div><div class="modal-actions">${button('Về phòng chơi',{href:'rooms',variant:'secondary'})}${button('Thử lại mẫu',{action:'finish-reconnect',ico:'refresh'})}</div>`),
 'finish-reconnect':()=>{closeModal();toast('Đóng trạng thái mất kết nối mẫu. Không có kết nối thật được mở.')},
 'empty-demo':()=>openModal('Ván của bạn sẽ ở đây',`${emptyState('Chưa có ván đã lưu','Bắt đầu một ván đầu tiên và tạo câu chuyện của riêng bạn.',button('Khám phá trò chơi',{href:'library',ico:'arrow'}))}`)
};
function showRoomCode(){openModal('Mã phòng của bạn',`<p>Chọn mã để sao chép thủ công. Đây chỉ là phòng minh họa.</p><div class="dialog-code" tabindex="0">TB-2086</div>${button('Đóng',{action:'close-modal',variant:'secondary',cls:'full-width'})}`)}

// Event delegation keeps routes independent from the application shell.
document.addEventListener('click',event=>{
 const link=event.target.closest('a[href^="#"]');if(link){const href=link.getAttribute('href').slice(1);if(href==='main-content'){event.preventDefault();document.getElementById('main-content')?.focus();return;}if(link.dataset.action){event.preventDefault()}else{state.menuOpen=false;closeModal(false);if(currentRoute===href){event.preventDefault();render({keepScroll:true});}return;}}
 const control=event.target.closest('[data-action]');if(control){event.preventDefault();if(control.disabled)return;const fn=actions[control.dataset.action];if(fn)fn(control.dataset.value,control);else toast('Thao tác đang được thiết kế.');return;}
 const square=event.target.closest('[data-chess]');if(square){handleChess(square.dataset.chess);return;}
 const xq=event.target.closest('[data-xq]');if(xq){state.selectedXq=Number(xq.dataset.xq);state.analysisArrow=true;render({keepScroll:true});toast('Đã chọn quân. Đường đi hiển thị là minh họa, không kiểm tra luật.');return;}
 const caro=event.target.closest('[data-caro]');if(caro){if(!state.caro)state.caro=[[6,5,'x'],[6,6,'o'],[7,6,'x'],[5,5,'o'],[8,7,'x'],[4,5,'o'],[5,7,'x'],[4,6,'o'],[8,6,'x']];const[r,c]=caro.dataset.caro.split(',').map(Number);if(!state.caro.some(p=>p[0]===r&&p[1]===c)){state.caro.push([r,c,state.caro.length%2?'o':'x']);render({keepScroll:true})}}
});
function handleChess(coords){const[r,c]=coords.split(',').map(Number);if(state.selectedChess&&state.chessTargets.some(t=>t[0]===r&&t[1]===c)){const[sr,sc]=state.selectedChess;const piece=state.chess[sr][sc];state.chess[r][c]=piece;state.chess[sr][sc]='';state.demoMoves.push(`${'abcdefgh'[sc]}${8-sr} → ${'abcdefgh'[c]}${8-r}`);state.selectedChess=null;state.chessTargets=[];render({keepScroll:true});toast('Đã di chuyển quân trong bản mẫu. Không kiểm tra toàn bộ luật cờ.');return;}
 if(!state.chess[r][c])return;state.selectedChess=[r,c];const code=state.chess[r][c].toLowerCase();const candidates=code==='n'?[[r-2,c-1],[r-2,c+1],[r+2,c-1],[r+2,c+1]]:code==='p'?[[r-1,c],[r-2,c]]:[[r-1,c],[r,c+1],[r,c-1]];state.chessTargets=candidates.filter(([rr,cc])=>rr>=0&&rr<8&&cc>=0&&cc<8&&!state.chess[rr][cc]);render({keepScroll:true});if(!state.chessTargets.length)toast('Quân này chưa có ô trống trong tương tác mẫu. Thử chọn Mã g1 hoặc Tốt d2.');}
document.addEventListener('input',event=>{const el=event.target;if(el.id==='game-search'){state.gameSearch=el.value;filterGames()}if(el.id==='friend-search'||el.id==='room-search'){const q=el.value.toLocaleLowerCase('vi');const selector=el.id==='friend-search'?'#friends-list .friend-row':'#room-grid .room-card';document.querySelectorAll(selector).forEach(row=>row.hidden=!row.dataset.name.includes(q))}if(el.id==='cpu-budget'){state.cpuBudget=Number(el.value);document.getElementById('cpu-value').textContent=el.value+'%'}if(el.id==='replay-slider'){state.replayStep=Number(el.value);state.analysisArrow=state.replayStep%2===0;render({keepScroll:true})}});
document.addEventListener('change',event=>{const el=event.target;if(el.closest('#setup-form')&&['mode','time','level','side'].includes(el.name)){state.setup[el.name]=el.value;safeSave();render({keepScroll:true})}});
document.addEventListener('submit',event=>{const form=event.target;event.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);switch(form.id){case'chat-form':addChat(String(fd.get('message')||''));break;case'room-chat-form':{const text=String(fd.get('message')||'').trim().slice(0,200);if(text){state.roomChat.push(text);render({keepScroll:true})}break;}case'auth-form':{if(fd.get('displayName'))state.displayName=String(fd.get('displayName')).trim().slice(0,40);form.reset();safeSave();go('library');toast('Đã mở hồ sơ mẫu. Không tạo phiên đăng nhập hay gửi mật khẩu.');break;}case'profile-form':state.displayName=String(fd.get('displayName')||'Bạn').trim().slice(0,40);safeSave();closeModal();render({keepScroll:true});toast('Đã cập nhật tên trên trình duyệt này.');break;case'create-room-form':state.roomGame=String(fd.get('game')||'chess');state.roomName=String(fd.get('roomName')||'Một ván cùng bạn').trim().slice(0,60);state.ready=false;closeModal();go('room');toast('Đã tạo phòng mẫu, không gọi server.');break;case'join-code-form':closeModal();state.roomGame='chess';go('room');break;case'add-friend-form':closeModal();toast('Đã mô phỏng gửi lời mời. Không gửi đến người dùng thật.');break;}});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){const input=document.getElementById('game-search');if(input){event.preventDefault();input.focus()}}if(event.key==='Escape'&&state.menuOpen){state.menuOpen=false;render({keepScroll:true})}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-xq]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.addEventListener('hashchange',()=>{closeModal(false);state.menuOpen=false;render();window.scrollTo(0,0)});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.prefs.theme==='system')applyPreferences()});
render();
// Read-only helpers for the included QA runner, not part of a future product API.
window.TabulaPrototype={routes:SCREEN_INDEX.map(s=>s[1]),version:'1.0.0',navigate:go};

})();
