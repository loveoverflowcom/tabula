# CI pipeline — doc 01 §6.1.
#
# Target PR wall-clock: UNDER 10 MINUTES. If it grows past that, move the wasm
# job into a merge-queue-only stage rather than weakening the checks.
# Weakening a check is how the invariants rot.
#
# Phase note: Only implemented / current-phase required gates run on normal PRs.
# Future-phase capabilities (protocol wire vectors, integration databases) remain
# documented in xtask and the architectural roadmap, and are activated when their
# respective phases begin.

name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One maintained skill tree, working metadata/links/helpers, and failure fixtures.
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 .agents/skills/tabula-engineering/scripts/check_skills.py
      - run: python3 .agents/skills/tabula-engineering/scripts/test_check_skills.py
      - run: python3 .agents/skills/tabula-engineering/scripts/test_ai_doc_contracts.py

  # ---------------------------------------------------------------- fast gates
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # I-1 and I-15. This is the job that keeps the architecture honest: it walks
  # the RESOLVED dependency graph per crate and asserts the deps.toml matrix, so
  # a transitive violation fails as loudly as a direct one.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-deps

  # I-9: no platform crate may branch on, or import, a specific game.
  no-game-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-no-game-ids

  # game.toml schema and Cargo feature shape. A future compiled-metadata
  # cross-check is not implemented by check-manifests yet. (doc 02 §4.3)
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-manifests

  # Generated files are committed. If they are stale the diff is a silent lie.
  generated-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gen-tokens
      - run: git diff --exit-code -- apps/web/style/tokens.css crates/tabula-design/src/generated.rs docs/ui/tokens.json

  # No hand-written raw color literals in presentation or game code (doc 04 §8.1).
  raw-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-no-raw-colors

  # Compose Multiplatform mobile foundation (ADR-0032). Proves the shared Kotlin compiles for
  # Android and iOS (klib), the host unit tests pass, and the debug APK assembles. It does NOT
  # link the iOS framework or build the Xcode project (that needs a macOS runner) and runs no
  # device or emulator.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: mobile
        run: ./gradlew --console=plain :shared:testAndroidHostTest :android:assembleDebug
      - working-directory: mobile
        run: ./gradlew --console=plain :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64

  # -------------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Unit + property + replay. Every game crate's conformance! suite runs here.
      - run: cargo nextest run --workspace

  # doc 01 §5.1 rule 1: every crate builds with no features AND with all features.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --no-default-features
      - run: cargo check --workspace --all-features

  # WASM-only breakage (panics, missing features, size regressions) is invisible
  # to the native build. Phase 2+ for game-client, Phase 5+ for web.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tabula-game-client --target wasm32-unknown-unknown --no-default-features --features web
      - run: cargo build -p tabula-game-client --no-default-features --features web --target wasm32-unknown-unknown --profile wasm-release
      - run: cargo xtask stage-wasm-game
      # Current local loading boundary: real loader contracts, cache fault
      # cases and byte/resource budgets; never substitute for browser timing.
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node --test apps/game-client/web/tests/*.test.cjs
      - run: python3 tools/test_serve_local_shell.py
      - run: cargo tree -p tabula-game-client --no-default-features --features web --target wasm32-unknown-unknown --edges normal > target/local-game-graph.txt
      - run: python3 tools/tests/check-loading-budgets.py --game-wasm target/wasm32-unknown-unknown/wasm-release/tabula-game-client.wasm --game-tree target/local-game-graph.txt
      - run: cargo check -p tabula-web --target wasm32-unknown-unknown
      # Bundle size cap: < 6 MB gzipped (doc 01 §7). Fail on a >10% regression.
      # - run: cargo xtask check-bundle-size

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
