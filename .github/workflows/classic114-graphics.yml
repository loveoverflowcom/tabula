name: bounded-classic114-graphics
on:
  push:
    branches: ['evidence/classic114-runtime-capture-20261007']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-classic114-graphics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-classic-entry-and-board:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TABULA_CLASSIC_GRAPHICS_QA: '1'
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          ref: 8ea4d9bae8ca377ed189e103218dc57e73cfcd0a
          path: actual-src
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.96', targets: wasm32-unknown-unknown}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actual-src -> target
          cache-on-failure: true
      - name: Official browser and source build tooling
        run: |
          python3 -m pip install -r actual-src/tests/online-match/requirements.txt
          python3 -m playwright install --with-deps chromium
          cargo install trunk --version 0.21.14 --locked
      - name: Actual clean source Leptos and Chess WASM builds
        working-directory: actual-src
        run: |
          cargo clean --locked
          (cd apps/web && TABULA_PLAY_BASE=/play trunk build --release --cargo-profile wasm-release --features online)
          cargo build --locked -p tabula-game-client --no-default-features --features web --bin tabula-game-client --target wasm32-unknown-unknown --profile wasm-release
          cargo xtask stage-wasm-game
      - name: Actual anonymous entry and source-separated licensed-piece runtime captures
        run: python3 harness/tools/classic114-review/capture.py --source-root actual-src --output verification/classic114
      - name: Preserve original PNGs and exact source/build/action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-classic114-runtime
          path: verification/classic114
          if-no-files-found: error
          retention-days: 14
