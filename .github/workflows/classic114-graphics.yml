name: bounded-classic114-history-diagnostic
on:
  push:
    branches: ['evidence/classic114-runtime-capture-20261007']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-classic114-history-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-classic-native-history-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TABULA_CLASSIC_GRAPHICS_QA: '1'
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          ref: f68970bf48c0571bed083047031e8ff6b6e40a2a
          path: actual-src
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.96', targets: wasm32-unknown-unknown}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actual-src -> target
          cache-on-failure: true
      - name: Official browser and source build tooling
        run: |
          python3 -m pip install -r actual-src/tests/online-match/requirements.txt
          python3 -m playwright install --with-deps chromium
          cargo install trunk --version 0.21.14 --locked
      - name: Actual clean source Leptos entry build
        working-directory: actual-src
        run: |
          cargo clean --locked
          (cd apps/web && TABULA_PLAY_BASE=/play trunk build --release --cargo-profile wasm-release --features online)
      - name: Actual corrected-source public history and code recovery
        run: python3 harness/tools/classic114-review/capture.py --source-root actual-src --source-commit f68970bf48c0571bed083047031e8ff6b6e40a2a --source-tree da9b6898754688a0fddffda4104fc7ac5bb04516 --output verification/classic114-history-diagnostic
      - name: Preserve original PNGs and exact source/build/action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-classic114-history-diagnostic
          path: verification/classic114-history-diagnostic
          if-no-files-found: error
          retention-days: 14
