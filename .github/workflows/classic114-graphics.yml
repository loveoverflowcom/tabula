name: bounded-classic114-facts-recheck
on:
  push:
    branches: ['evidence/classic114-runtime-capture-20261007']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-classic114-facts-recheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-classic-facts-and-history:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TABULA_CLASSIC_GRAPHICS_QA: '1'
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          ref: 49da8c29d805303255b1d7ea2d3cc5563c9c7787
          path: actual-src
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.96', targets: wasm32-unknown-unknown}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actual-src -> target
          cache-on-failure: true
      - name: Official browser and source build tooling
        run: |
          python3 -m pip install -r actual-src/tests/online-match/requirements.txt
          python3 -m playwright install --with-deps chromium
          cargo install trunk --version 0.21.14 --locked
      - name: Actual clean source Leptos entry build
        working-directory: actual-src
        run: |
          cargo clean --locked
          (cd apps/web && TABULA_PLAY_BASE=/play trunk build --release --cargo-profile wasm-release --features online)
      - name: Actual scoped facts reflow and semantic history recheck
        run: python3 harness/tools/classic114-review/capture.py --source-root actual-src --source-commit 49da8c29d805303255b1d7ea2d3cc5563c9c7787 --source-tree 58ce919119a3237bab626a86150b5d1c32b2ee48 --output verification/classic114-facts
      - name: Preserve original PNGs and exact source/build/action receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-classic114-facts-recheck
          path: verification/classic114-facts
          if-no-files-found: error
          retention-days: 14
