name: bounded-chess112-text
on:
  push:
    branches: ['evidence/chess112-text-capture-20261007']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-chess112-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-chess-graphics:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TABULA_CHESS_GRAPHICS_QA: '1'
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}
      - uses: actions/checkout@v4
        with:
          ref: 94dc7df5012640e7d6909d1ab5c02eb273d1dc37
          path: actual-src
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.96', targets: wasm32-unknown-unknown}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actual-src -> target
          cache-on-failure: true
      - name: Official browser and bounded public-pixel OCR tooling
        run: |
          python3 -m pip install -r actual-src/tests/online-match/requirements.txt
          python3 -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Actual source-owned Chess WASM and staged resources
        working-directory: actual-src
        run: |
          cargo clean --locked
          cargo build --locked -p tabula-game-client --no-default-features --features web --bin tabula-game-client --target wasm32-unknown-unknown --profile wasm-release
          cargo xtask stage-wasm-game
      - name: Narrow corrected HUD screenshots and read-only graphics sample
        run: python3 harness/tools/chess112-text-review/capture.py --source-root actual-src --output verification/chess112-text
      - name: Preserve original screenshots and exact-source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-chess112-text-runtime
          path: verification/chess112-text
          if-no-files-found: error
          retention-days: 14
