# The manifest — source of truth for the catalog. (doc 02 §4.3)
#
# Two representations exist on purpose: ops needs to read and diff capabilities
# without compiling, and Phase B/C packages ship a manifest without our source.
# `xtask check-manifests` validates this schema independently. The compiled
# metadata cross-check is deferred; see xtask/README.md.

id            = "com.tabula.tictactoe"
version       = "0.2.0"
rules_version = 2

# i18n keys, never literals — the catalog is localized by the shell.
name_key        = "game.tictactoe.name"
tagline_key     = "game.tictactoe.tagline"
description_key = "game.tictactoe.description"

categories        = ["abstract"]
complexity        = "light"
content_rating    = "everyone"
estimated_minutes = [1, 3]
tags              = ["template", "tutorial"]

[seats]
min            = 2
max            = 2
symmetric      = false      # X moves first; matchmaking should alternate
fill_with_bots = true

[capabilities]
turn_model         = "strict_sequential"
hidden_information = false
spectators         = "live"
voice              = "no"
ranked             = "no"          # it is a template, not a product (doc 08 §5.0)
pausable           = false
client_preview     = true          # nothing hidden affects legality, so preview is honest
durability         = "ack_after_apply"
state_size         = "tiny"
max_match_duration = 600000

[capabilities.chat]
channels    = [{ key = "table", kind = "table" }]
game_scoped = false

[capabilities.async_turns]
supported = false

[capabilities.reconnect]
grace        = 60000
notify_rules = false        # nothing to do about it; the move timer handles absence

[capabilities.substitution]
kind   = "bot_only"
levels = ["trivial", "easy"]

[capabilities.apply_budget]
max_apply_micros     = 200
max_events_per_input = 4

[assets]
pack    = "tictactoe@0.2.0"
size_kb = 40

[rollout]
enabled  = true
audience = "staff"          # it ships as a template, not to players

[theme]
accent = "#4C6FFF"
mood   = "calm"
