[package]
name        = "tabula-game-tictactoe"
version     = "0.2.0"
description = "Tic-tac-toe — the Tabula SDK smoke test and game template."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# =============================================================================
# THE FEATURE SPLIT IS I-1 IN PRACTICE, NOT COSMETICS. (doc 01 §5.1 rule 3)
#
#   server builds:  --no-default-features --features rules,bots
#   client builds:  --features rules,presentation
#
# That is what lets the server compile a game with no renderer and the client
# compile it with no database. Every game crate uses exactly this shape.
# =============================================================================
[features]
default      = ["rules"]
rules        = []
presentation = ["dep:tabula-presentation", "dep:tabula-design", "dep:tabula-assets"]
bots         = []
testkit      = ["dep:tabula-testkit"]

[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
serde           = { workspace = true }
smallvec        = { workspace = true }
thiserror       = { workspace = true }

tabula-presentation = { workspace = true, optional = true }
tabula-design       = { workspace = true, optional = true }
tabula-assets       = { workspace = true, optional = true }
tabula-testkit      = { workspace = true, optional = true }

[dev-dependencies]
tabula-testkit = { workspace = true }

[lints]
workspace = true
