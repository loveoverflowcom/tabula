[package]
name        = "tabula-game-chess"
version     = "0.1.0"
description = "Chess — the correctness benchmark (perft, clocks, ratings)"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

# PHASE 1 — see src/lib.rs for the gate and the contract sketch.
#
# Feature shape is identical for every game crate (doc 01 §5.1 rule 3):
#   server: --no-default-features --features rules,bots
#   client: --features rules,presentation
[features]
default      = ["rules"]
rules        = []
presentation = ["dep:tabula-presentation", "dep:tabula-design", "dep:tabula-assets", "dep:glam"]
bots         = []
testkit      = ["dep:tabula-testkit"]

[dependencies]
tabula-core     = { workspace = true }
tabula-game-api = { workspace = true }
serde           = { workspace = true }
smallvec        = { workspace = true }

tabula-presentation = { workspace = true, optional = true }
tabula-design       = { workspace = true, optional = true }
tabula-assets       = { workspace = true, optional = true }
glam                = { workspace = true, optional = true }
tabula-testkit      = { workspace = true, optional = true }

[dev-dependencies]
tabula-testkit = { workspace = true, features = ["presentation"] }
blake3 = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[lints]
workspace = true
