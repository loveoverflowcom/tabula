[package]
name = "tabula-game-age-war"
version = "0.0.0"
description = "Age War D01: original unbalanced design catalog and typed, phase-gated seams"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# PHASE D01: design scaffold only. C01 remains blocked on the D06 owner gate.
# Feature names follow doc 01 §5.1; none makes gameplay available.
[features]
default = ["rules"]
rules = []
bots = []
presentation = ["dep:tabula-presentation", "dep:tabula-design", "dep:tabula-assets"]
testkit = ["dep:tabula-testkit"]

[dependencies]
tabula-presentation = { workspace = true, optional = true }
tabula-design = { workspace = true, optional = true }
tabula-assets = { workspace = true, optional = true }
tabula-testkit = { workspace = true, optional = true }

[lints]
workspace = true
