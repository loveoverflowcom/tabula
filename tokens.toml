# Tabula's authored semantic design-system source. (doc 04 §7–§8)
#
# `cargo xtask gen-tokens` validates this document and deterministically emits
# the renderer-neutral Rust themes, web CSS custom properties, and the design
# tooling JSON export. Resolved scheme values are authored here; `[ref.palette]`
# is design guidance and provenance, not an implicit runtime derivation.

[meta]
identity = "M3 Expressive-inspired"
schemes = ["light", "dark", "hc-light", "hc-dark"]

# Tier 1 — reference only. Consumers use Tier 2 semantic roles instead.
[ref.palette]
# Sampled filled-control violet from the owner's reference. Resolved roles below
# deepen that hue for emphasis; dark/HC schemes retain accessible on-colors.
primary-source = "#745FA1"
neutral-source = "#8E8E99"
success-source = "#2E9E5B"
warning-source = "#C88A17"
danger-source = "#D0453B"
# T Portal identity provenance; resolved brand roles below remain independent
# of interaction colors and game accents (issue #91).
brand-ink = "#5E4B8B"
brand-lavender = "#B9A7F3"
brand-purple = "#7C63ED"
brand-lilac = "#EBE6F7"
brand-dark = "#473D66"
brand-light = "#F7F4FF"
brand-panel = "#E2DAFA"

