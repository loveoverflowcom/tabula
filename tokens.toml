[sys.space]
# Logical dp-like units: semantic names intentionally avoid consumer indexing.
none = 0
xxs = 2
xs = 4
sm = 8
md = 12
lg = 16
xl = 20
xxl = 24
xxxl = 32
xxxxl = 40
xxxxxl = 48
xxxxxxl = 64

[sys.shape]
# `full` is the renderer convention for a fully rounded capsule/circle.
none = 0.0
xs = 4.0
sm = 8.0
md = 12.0
lg = 16.0
xl = 24.0
full = 9999.0
card = 16.0
board = 12.0
token = 9999.0
sheet = 24.0
button = 14.0
chip = 8.0

[sys.type]
# All metrics are logical units. `family` is a renderer-neutral family role.
[sys.type.family]
display = 'Georgia, "Noto Serif", "Times New Roman", serif'
text = "ui-sans-serif, system-ui, sans-serif"
mono = "ui-monospace, SFMono-Regular, monospace"
[sys.type.shell-display]
# Compact CMP Home/Library and hero headings; preserve the generic display scale.
family = "display"
size = 28.0
line-height = 36.0
weight = 400
letter-spacing = 0.0
