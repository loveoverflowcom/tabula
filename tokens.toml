team = ["#005F73", "#CA6702", "#6D597A", "#127D66", "#B64664", "#385F91", "#79521E", "#5E587E"]
seat-marker = ["#005F73", "#CA6702", "#6D597A", "#127D66", "#B64664", "#385F91", "#79521E", "#5E587E"]

