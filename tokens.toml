on-success = "#00391A"
turn-active = "#73E2A3"
turn-waiting = "#CAC3CE"
legal-target = "#74F8A6"
illegal-target = "#FFB4AB"
selected = "#CFBCFF"
last-action = "#FFDDB1"
threat = "#FFB4AB"
hidden = "#C8C6D0"
team = ["#66D9EF", "#FFB86C", "#D6A5E8", "#74F8A6", "#FF9DB8", "#8AB4F8", "#E8C48A", "#B8B0FF"]
seat-marker = ["#66D9EF", "#FFB86C", "#D6A5E8", "#74F8A6", "#FF9DB8", "#8AB4F8", "#E8C48A", "#B8B0FF"]

[schemes.hc-light]
surface = "#FFFFFF"
container = "#FFFFFF"
container-high = "#F5F5F5"
on-surface = "#000000"
on-surface-variant = "#000000"
outline = "#000000"
primary = "#2C0078"
on-primary = "#FFFFFF"
danger = "#910000"
on-danger = "#FFFFFF"
success = "#005A20"
on-success = "#FFFFFF"
turn-active = "#005A20"
turn-waiting = "#000000"
legal-target = "#005A20"
illegal-target = "#910000"
selected = "#2C0078"
last-action = "#6B4700"
threat = "#910000"
hidden = "#333333"
team = ["#004B5C", "#984D00", "#4B3158", "#005A20", "#8F153C", "#003D7A", "#5E3E00", "#42306D"]
seat-marker = ["#004B5C", "#984D00", "#4B3158", "#005A20", "#8F153C", "#003D7A", "#5E3E00", "#42306D"]

[schemes.hc-dark]
