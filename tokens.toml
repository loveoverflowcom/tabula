[sys.state]
hover = 0.08
focus = 0.12
press = 0.12
drag = 0.16
disabled-content = 0.38
disabled-container = 0.12

[sys.motion]
instant = 80
short = 160
medium = 280
long = 480
xlong = 800
stagger = 40

[sys.motion.spring]
snappy = { stiffness = 380.0, damping = 26.0, mass = 1.0 }
standard = { stiffness = 260.0, damping = 24.0, mass = 1.0 }
weighty = { stiffness = 180.0, damping = 22.0, mass = 1.4 }
bouncy = { stiffness = 320.0, damping = 14.0, mass = 1.0 }

[sys.motion.reduced]
duration-scale = 0.0
prefer-fade = true
disable-ambient = true
keep-informative = true

# Profiles are compact semantic requests, not animation timelines.
[sys.motion.profile]
piece-move = { duration = "medium", spring = "weighty", category = "informative" }
card-deal = { duration = "medium", spring = "standard", stagger = "stagger", category = "informative" }
card-play = { duration = "medium", spring = "snappy", category = "informative" }
tile-place = { duration = "medium", spring = "weighty", category = "informative" }
token-drop = { duration = "short", spring = "bouncy", category = "informative" }
reveal = { duration = "long", spring = "standard", category = "informative" }
phase-change = { duration = "long", spring = "standard", category = "ambient" }
turn-change = { duration = "short", spring = "standard", category = "informative" }
vote = { duration = "short", spring = "snappy", category = "informative" }
score-update = { duration = "medium", spring = "standard", category = "informative" }
win = { duration = "xlong", spring = "bouncy", category = "ambient" }
lose = { duration = "xlong", spring = "standard", category = "ambient" }
invalid = { duration = "instant", spring = "snappy", category = "informative" }
enter = { duration = "medium", spring = "standard", category = "informative" }
exit = { duration = "short", spring = "standard", category = "informative" }
drag-lift = { duration = "short", spring = "snappy", category = "informative" }
drag-drop = { duration = "short", spring = "bouncy", category = "informative" }

[sys.density]
# Logical accessibility units/dp, never physical pixels.
scale = 1.0
min-target = 44.0

[sys.elevation]
# Abstract levels; renderers select their own shadow/asset treatment.
low = 1
medium = 2
high = 3

[sys.focus]
ring-width = 3.0
ring-color = "primary"

# Tier 3 remains deliberately empty. Add a component token only when a reusable
# component has a written reason to deviate from a system semantic role.
[comp]

# Game-specific decorative material, not common M3 navigation or interactive
# state semantics. Chess uses sys.color selected/focus/legal-target/threat
# overlays for meaning; these roles only supply its approved carved-table art.
# The white piece tint is the multiplicative identity for colored raster art.
# Issue #85: truffle wood and slate follow the original game-feel reference.
# Materials remain decorative; sys roles still own selected/legal/check/focus.
[game-art.chess.light]
page = "#F5F0E6"
surface = "#FEFBF4"
soft = "#E5DBE7"
ink = "#352146"
muted = "#6A5974"
deep = "#302A33"
on-deep = "#F1EAF7"
board-light = "#D0BDAD"
board-dark = "#665368"
brass = "#CFAD77"
piece-tint = "#FFFFFF"

