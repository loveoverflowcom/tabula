# cargo-deny — global bans, licence policy, advisories (doc 01 §1.4, §6.1).
#
# This is the coarse net. The fine net is `xtask check-deps`, which enforces the
# PER-CRATE matrix in deps.toml. cargo-deny cannot express "tokio is fine in the
# server but forbidden in games", which is exactly the rule that matters most —
# hence two tools.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[advisories]
version = 2
yanked  = "deny"
ignore = [
  # RUSTSEC-2025-0035: Multiple soundness issues in `macroquad` 0.4.16.
  #
  # Temporary acceptance:
  # - Confined to tabula-render-macroquad and tabula-game-client via the replaceable renderer seam (doc 04 §6.3).
  # - No deterministic rules code (tabula-core, tabula-game-api, games/* rules) depends on Macroquad.
  # - No patched upstream release is available as of 2026-09-01.
  # - Exposed: native/WASM client presentation rendering backend.
  # - Not exposed: deterministic rules, match runtime, server, protocol, replay.
  # - Review trigger: upstream Macroquad release with soundness fixes or renderer backend migration.
  # - Removal condition: upstream fixed release or renderer backend migration.
  { id = "RUSTSEC-2025-0035", reason = "Confined to tabula-render-macroquad/tabula-game-client presentation backend; no rules code exposed; no upstream fix available" },

  # RUSTSEC-2026-0192: `ttf-parser` 0.25.1 is unmaintained (transitive dependency of macroquad via fontdue).
  #
  # Temporary acceptance:
  # - Confined to macroquad font rendering in tabula-render-macroquad and tabula-game-client.
  # - No deterministic rules code depends on ttf-parser or fontdue.
  # - No patched upstream release in fontdue/macroquad is available as of 2026-09-01.
  # - Exposed: client font rendering in Macroquad presentation backend.
  # - Not exposed: deterministic rules, match runtime, server, core crates.
  # - Review trigger: upstream macroquad/fontdue migration to skrifa or renderer backend migration.
  # - Removal condition: upstream update or renderer backend migration.
  { id = "RUSTSEC-2026-0192", reason = "Confined to macroquad fontdue transitive dep in presentation backend; no rules code exposed; no upstream fix available" },

  # RUSTSEC-2024-0436 (`paste`) and RUSTSEC-2026-0173 (`proc-macro-error2`):
  # both unmaintained, both reached only through Leptos (ADR-0028).
  #
  # Temporary acceptance:
  # - Both are build-time macro machinery: `paste` via `either_of`/`tachys`,
  #   `proc-macro-error2` via `leptos_macro`/`leptos_router_macro`. Neither is a
  #   runtime dependency of the shipped shell, and neither is reachable from any
  #   rules, match-runtime, protocol or server crate (deps.toml forbids `leptos`
  #   everywhere except `apps/web` and `apps/admin`).
  # - Unmaintained is not a known vulnerability; no advisory describes an
  #   exploitable defect in either crate.
  # - Exposed: the `apps/web` build. Not exposed: anything we ship to a server,
  #   anything deterministic, and the Macroquad gameplay client.
  # - Review trigger: a Leptos release that drops them, or any advisory on
  #   either crate that describes an actual vulnerability.
  # - Removal condition: upstream Leptos no longer depends on them.
  { id = "RUSTSEC-2024-0436", reason = "Unmaintained build-time macro dep of Leptos; not shipped, not reachable from rules/server crates" },
  { id = "RUSTSEC-2026-0173", reason = "Unmaintained build-time macro dep of Leptos; not shipped, not reachable from rules/server crates" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "CC0-1.0", "MPL-2.0",
  # BSL-1.0 (Boost): OSI-approved, FSF Free/Libre, permissive with no source
  # or attribution obligation on binaries. Reached through `xxhash-rust`, a
  # dependency of `server_fn` inside Leptos (ADR-0028). It constrains neither
  # arm of our AGPL/commercial dual licence.
  "BSL-1.0",
]
confidence-threshold = 0.9
# We ship an AGPL/commercial dual licence. Anything copyleft-viral beyond MPL-2.0
# in a linked dependency would constrain the commercial arm — so it is denied,
# not merely reviewed.
#
# The `allow` list above is a THIRD-PARTY policy. It must not also have to
# accept our own crates' declared license: every workspace member sets
# `license = "AGPL-3.0-or-later OR LicenseRef-Commercial"` (via
# `license.workspace = true`), and `LicenseRef-Commercial` is a private
# reference, not an SPDX id anything external would recognize. Every crate in
# this workspace also sets `publish = false` (Cargo.toml, workspace-inherited)
# because none of it is meant to reach crates.io — so `private.ignore` exempts
# exactly those crates from this check, rather than adding our own private
# license notice to a list that is supposed to describe what we accept from
# others.
private = { ignore = true }

[bans]
# Duplicate versions cost binary size, which is a hard constraint for the WASM
# game bundle (< 6 MB gzipped, doc 01 §7). `warn` now; escalate to `deny` once
# the tree stabilises in Phase 4.
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true

deny = [
  # Prefer rustls; openssl is a cross-compilation and mobile-packaging tax.
  { name = "openssl" },
  { name = "openssl-sys" },
  # chrono's default features pull in `time` 0.1 (RUSTSEC-2020-0071 territory)
  # and localtime handling we do not want. Use `time`, or `LogicalTime` in rules.
  { name = "chrono", wrappers = [] },
  # I-4: rules must not reach OS entropy. Listed here as a second net; the real
  # enforcement is per-crate in deps.toml.
  #
  # `tempfile` and `rand_core` are wrappers: `tabula-testkit`'s test tooling
  # pulls `proptest` and `insta` (via tempfile/rand_core), which need OS randomness.
  # That path is test/dev tooling behind an unconstrained tier (`tabula-testkit`,
  # tier = "test" in deps.toml) — it never ships in rules.
  #
  # `uuid` is a third wrapper, added with the Leptos shell (ADR-0028): the only
  # path to it is `leptos_macro`, a PROC-MACRO crate that runs at build time and
  # is never linked into the shipped wasm — and `apps/web` is a binary that no
  # rules crate can depend on. The per-crate net in deps.toml still forbids
  # `getrandom` everywhere it would matter.
  # ADR-0035 permits OS entropy only in the runtime session credential owner.
  # SQLx 0.9 uses rand 0.10 as its direct OS-entropy wrapper for SCRAM.
  # The deterministic per-crate ban remains enforced by xtask check-deps.
  { name = "getrandom", wrappers = ["rand_core", "tempfile", "uuid", "tabula-session", "rand"] },
]

skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
